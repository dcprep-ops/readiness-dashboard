// Per-campus signoff progress: counts individual signoff cells (Schools, Ops,
// Tech) across all rooms — not whole spaces — so partial adoption (e.g. Tech
// keeps logging even if Ops hasn't started using the app) still shows real
// progress. Schools/MDS is no longer part of readiness tracking.
function buildCampusProgress(rooms) {
  let ok = 0, minor = 0, total = 0;
  rooms.forEach(r => {
    const cls = combinedSpaceStatus(r);
    if (cls === 'dot-na') return;
    total++;
    if (cls === 'dot-ok')    ok++;
    if (cls === 'dot-minor') minor++;
  });
  if (!total) return '';
  const okPct    = Math.round(ok    / total * 100);
  const minorPct = Math.round(minor / total * 100);
  const combined = okPct + minorPct;
  const okSeg    = okPct    > 0 ? `<div class="seg-gray-ok" style="width:${okPct}%"></div>` : '';
  const minorSeg = minorPct > 0 ? `<div class="seg-gray-mn" style="width:${minorPct}%"></div>` : '';
  return `<div class="net-summary">
    <div class="net-summary-title">Space Readiness Progress</div>
    <div class="kpi-pct">${combined}<span class="kpi-pct-unit">%</span></div>
    <div class="kpi-bar-track" style="margin-bottom:24px">${okSeg}${minorSeg}</div>
  </div>`;
}

// Two-tier liquid-fill circle: green liquid rises for "fully ready", a
// yellow band on top of it for "minor items remain" — same two segments the
// old bar showed, just as a fill level instead of a bar length. Text color
// is picked per-render based on what's actually behind the center point
// (green fill, yellow fill, or empty background) rather than a fixed color,
// so it stays readable at any percentage — a plain "white if >50%" rule
// would produce white-on-yellow in some ranges, which is hard to read (the
// app's own yellow dot already uses dark text for exactly this reason).
function buildLiquidCircle(ok, minor, title, subtitle, size) {
  size = size || 132;
  const r = size / 2 - 3, cx = size / 2, cy = size / 2;
  const combined = ok + minor;
  const greenTopY = cy + r - (ok / 100) * 2 * r;
  const combinedTopY = cy + r - (combined / 100) * 2 * r;
  const clipId = 'liq' + Math.random().toString(36).slice(2, 9);

  let textColor;
  if (greenTopY <= cy)          textColor = '#fff';       // center sits in the green fill
  else if (combinedTopY <= cy)  textColor = '#1A2B3C';     // center sits in the yellow band
  else                          textColor = 'var(--text)'; // center sits above the fill

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <defs><clipPath id="${clipId}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--lt)" stroke="var(--border)" stroke-width="1"/>
    <g clip-path="url(#${clipId})">
      <rect x="0" y="${combinedTopY}" width="${size}" height="${size}" fill="var(--yellow)"/>
      <rect x="0" y="${greenTopY}" width="${size}" height="${size}" fill="var(--green)"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="${cx}" y="${cy + 8}" text-anchor="middle" font-size="26" font-weight="600" fill="${textColor}">${combined}<tspan font-size="14">%</tspan></text>
  </svg>
  <div style="text-align:center;margin-top:8px">
    <div style="font-size:12px;font-weight:600;color:var(--text)">${title}</div>
    ${subtitle ? `<div style="font-size:10px;color:var(--muted);max-width:${size + 30}px;margin:2px auto 0">${subtitle}</div>` : ''}
  </div>`;
}

function buildOverall(allData) {
  function networkPcts(track) {
    let ok = 0, minor = 0, total = 0;
    CAMPUSES.forEach(c => {
      const d = allData[c.code];
      if (!d) return;
      d.rooms.forEach(r => {
        const rec = track === 'tech' ? r.tech : r[track];
        const cls = dotClass(rec ? rec.assessment : null);
        if (cls === 'dot-na') return;
        total++;
        if (cls === 'dot-ok')    ok++;
        if (cls === 'dot-minor') minor++;
      });
    });
    return total ? { ok: Math.round(ok/total*100), minor: Math.round(minor/total*100), total, okCount: ok, needed: total - ok } : null;
  }

  function networkSpacePcts() {
    let ok = 0, minor = 0, total = 0;
    CAMPUSES.forEach(c => {
      const d = allData[c.code];
      if (!d) return;
      d.rooms.forEach(r => {
        const cls = combinedSpaceStatus(r);
        if (cls === 'dot-na') return;
        total++;
        if (cls === 'dot-ok')    ok++;
        if (cls === 'dot-minor') minor++;
      });
    });
    return total ? { ok: Math.round(ok/total*100), minor: Math.round(minor/total*100), total, okCount: ok, needed: total - ok } : null;
  }

  // Priority spaces are the ones that genuinely need to hit 100% — Classrooms,
  // Shared Student Spaces, Restrooms, Common Spaces. Offices/Staff Common
  // Spaces/Technology matter too, just less urgently, so they're tracked
  // separately rather than diluting this number.
  function networkPrioritySpacePcts() {
    let ok = 0, minor = 0, total = 0;
    CAMPUSES.forEach(c => {
      const d = allData[c.code];
      if (!d) return;
      d.rooms.forEach(r => {
        if (!PRIORITY_SECTIONS.includes(r.section)) return;
        const cls = combinedSpaceStatus(r);
        if (cls === 'dot-na') return;
        total++;
        if (cls === 'dot-ok')    ok++;
        if (cls === 'dot-minor') minor++;
      });
    });
    return total ? { ok: Math.round(ok/total*100), minor: Math.round(minor/total*100), total } : null;
  }

  const trackMeta = [
    {key:'SDO',  label:'Ops'},
    {key:'tech', label:'Tech'},
  ];

  const cardsHtml = trackMeta.map(t => {
    const p = networkPcts(t.key);
    if (!p) {
      return `<div class="signoff-row">
        <span class="signoff-label">${t.label}</span>
        <div class="signoff-bar-track"></div>
        <span style="font-size:11px;color:var(--muted)">Not yet assessed</span>
      </div>`;
    }
    const combined = p.ok + p.minor;
    const graySeg = combined > 0 ? `<div class="seg-gray" style="width:${combined}%"><span class="seg-label-ok">${combined >= 8 ? combined+'%' : ''}</span></div>` : '';
    return `<div class="signoff-row">
      <span class="signoff-label">${t.label}</span>
      <div class="signoff-bar-track">${graySeg}</div>
    </div>`;
  }).join('');

  const spaceP = networkSpacePcts();
  let spaceBarHtml = '';
  if (spaceP) {
    spaceBarHtml = `<div class="kpi-card" style="display:flex;flex-direction:column;align-items:center;flex:1 1 220px">
      ${buildLiquidCircle(spaceP.ok, spaceP.minor, 'Total spaces ready')}
    </div>`;
  }

  const priorityP = networkPrioritySpacePcts();
  let priorityBarHtml = '';
  if (priorityP) {
    priorityBarHtml = `<div class="kpi-card" style="display:flex;flex-direction:column;align-items:center;flex:1 1 220px">
      ${buildLiquidCircle(priorityP.ok, priorityP.minor, 'Priority spaces ready', 'Classrooms · Shared Student Spaces · Restrooms · Common Spaces')}
    </div>`;
  }

  const timestamps = CAMPUSES.map(c => allData[c.code] && allData[c.code].generated).filter(Boolean);
  const genStr = timestamps.length ? timestamps[0] : '';

  return `
    <div class="net-summary">
      <div style="display:flex;flex-wrap:wrap;gap:16px">
        ${spaceBarHtml}
        ${priorityBarHtml}
      </div>
      <div class="signoffs-box">
        <div class="signoffs-box-title">Signoffs</div>
        ${cardsHtml}
      </div>
      ${genStr ? `<div style="font-size:11px;color:var(--muted);margin-top:16px">Updated ${genStr}</div>` : ''}
    </div>`;
}

// A "space" is only Fully Ready when both tracks that apply to it are Fully
// Ready. If one track is N/A for that space (e.g. Tech doesn't apply), the
// other track alone decides. If both are N/A, the space itself is N/A.
// Core combined-status rule, operating on raw assessment strings rather than
// a room object — reusable both for "today" (via combinedSpaceStatus below)
// and for historical reconstruction, where we only have a raw SDO assessment
// string as of some past date (see buildHistoricalRemainingSeries).
function combinedStatusFromRaw(sdoAssessment, techAssessment) {
  const sdoCls  = dotClass(sdoAssessment);
  const techCls = dotClass(techAssessment);
  const sdoNA  = sdoCls  === 'dot-na';
  const techNA = techCls === 'dot-na';
  if (sdoNA && techNA) return 'dot-na';

  // Only "ok" and "minor" are meaningful for the combined space metric —
  // anything else (bad/pending/blank/not-assessed) just means this space
  // isn't cleanly green or yellow yet, so it doesn't map to either.
  function simplify(cls) { return (cls === 'dot-ok' || cls === 'dot-minor') ? cls : null; }

  // Single-signoff spaces (the other track is N/A): minor items from the
  // one team that actually applies still count as ready — there's no
  // second team's separate concerns to weigh it against.
  if (sdoNA)  return simplify(techCls) ? 'dot-ok' : 'dot-blank';
  if (techNA) return simplify(sdoCls)  ? 'dot-ok' : 'dot-blank';

  const a = simplify(sdoCls), b = simplify(techCls);
  if (a && b) {
    // Dual signoff: if at least one side is fully ready, the other being
    // ok or minor is close enough to count as cleared. Only when BOTH
    // sides are merely "minor" does it stay in the minor/remaining bucket.
    if (a === 'dot-ok' || b === 'dot-ok') return 'dot-ok';  // green/green or green/yellow
    return 'dot-minor';                                      // yellow/yellow
  }
  return 'dot-blank';                                        // anything involving bad/pending/not-assessed
}

function combinedSpaceStatus(room) {
  return combinedStatusFromRaw(
    room.SDO  ? room.SDO.assessment  : null,
    room.tech ? room.tech.assessment : null
  );
}

// combinedSpaceStatus() above is deliberately simplified for the burndown/
// category charts, which only care about "fully ready" vs "not yet" — it
// collapses bad, blank, and pending all into the same non-ok bucket and
// never returns dot-bad. That's wrong for the EMC map, which needs to show
// *why* a space isn't ready. This keeps dot-bad (and dot-pending) visible
// whenever either track actually reports it, matching the same urgency
// priority already used elsewhere (see URGENCY_RANK) — bad outranks
// everything — and only falls back to the collapsed combined status for
// the ok/minor/blank/na cases.
function mapRoomStatus(room) {
  const sdoCls  = dotClass(room.SDO  ? room.SDO.assessment  : null);
  const techCls = dotClass(room.tech ? room.tech.assessment : null);
  if (sdoCls === 'dot-bad'     || techCls === 'dot-bad')     return 'dot-bad';
  if (sdoCls === 'dot-pending' || techCls === 'dot-pending') return 'dot-pending';
  return combinedSpaceStatus(room);
}

// ── Total Progress: burndown + spaces-by-category ──────────────────────────
// NOTE: the Apps Script only returns each room's *current* status, not a
// history of what it was on past dates — there's no persisted daily
// snapshot to reconstruct a real trend line from. The "Actual" line below
// can only ever plot a single true data point: today. It'll only become a
// real multi-day trend once something (e.g. a daily Apps Script trigger)
// starts logging "date, total remaining" to a tracking tab. Flagged in the
// UI itself via the dashed "builds up day by day" note.
const CLUSTER_MAP = {AEC:'Anacostia', AMC:'Anacostia', BEC:'Benning', BMC:'Benning', EEC:'Edgewood', EMC:'Edgewood'};
const PRIORITY_SECTIONS = ['Classrooms', 'Shared Student Spaces', 'Restrooms', 'Common Spaces'];
const CLUSTER_COLOR = {Anacostia:'var(--blue)', Benning:'var(--gold)', Edgewood:'var(--green)'};
const START_DATE  = new Date(2026, 6, 30);  // Jul 30, 2026
const TARGET_DATE = new Date(2026, 7, 18);  // Aug 18, 2026
const FDOS_DATE   = new Date(2026, 7, 24);  // Aug 24, 2026 — First Day of School
const END_DATE    = new Date(2026, 7, 28);  // Aug 28, 2026 — chart extends past FDOS since not everything resolves by then

function countBusinessDays(start, end) {
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

// Inverse of countBusinessDays: given a 1-indexed business-day number,
// returns the actual calendar Date it falls on.
function businessDayToDate(start, dayIndex) {
  let count = 0;
  const d = new Date(start);
  while (true) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) {
      count++;
      if (count === dayIndex) return new Date(d);
    }
    d.setDate(d.getDate() + 1);
  }
}

function buildTodaysWins(winsRows) {
  const now = Date.now();
  const DAY_MS = 24 * 60 * 60 * 1000;

  // Latest update per role, but only if that latest update is itself
  // still within the last 24 hours — an old post doesn't linger just
  // because it happens to be the most recent thing that role ever said.
  const latestByRole = {};
  (winsRows || []).forEach(w => {
    if (!latestByRole[w.role] || w.ts > latestByRole[w.role].ts) latestByRole[w.role] = w;
  });
  const recent = Object.values(latestByRole)
    .filter(w => (now - w.ts) < DAY_MS)
    .sort((a, b) => b.ts - a.ts);

  const entriesHtml = recent.length
    ? recent.map(w => {
        const stamp = new Date(w.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        return `<div class="win-entry">
          <div class="win-top"><span class="win-school">${w.role}</span><span class="win-time">${stamp}</span></div>
          <div class="win-text">${w.text}</div>
        </div>`;
      }).join('')
    : `<div style="font-size:13px;color:var(--muted);padding:8px 0">No updates in the last 24 hours.</div>`;

  return `<div class="progress-block">
    <div class="progress-block-title">UPDATES</div>
    ${entriesHtml}
  </div>
  <div class="progress-block">
    <div class="progress-block-title">PROGRESS</div>
  </div>`;
}

// Prefers a real logged snapshot for any day that has one (accurate for
// both Ops and Tech, as they actually stood that day) — falling back to the
// Ops-only reconstruction for earlier days before snapshots started.
function mergeWithSnapshots(reconstructedSeries, snapshotRows) {
  const snapshotByDay = {};
  (snapshotRows || []).forEach(s => {
    const d = new Date(s.ts);
    d.setHours(0,0,0,0);
    if (d < START_DATE) return;
    const day = countBusinessDays(START_DATE, d);
    snapshotByDay[day] = s.totalRemaining;
  });
  return reconstructedSeries.map(p => ({
    day: p.day,
    totalRemaining: snapshotByDay.hasOwnProperty(p.day) ? snapshotByDay[p.day] : p.totalRemaining
  }));
}

// Reconstructs "total spaces remaining" for every business day from July 30
// through today, using each room's real historical Ops submission as of
// that day (from the raw Ops Readiness Log) paired with its CURRENT Tech
// status. Tech has no submission history at all — see getReadinessHistory's
// notes in the Apps Script — so this is the Ops trend told honestly, not a
// true historical Tech trend. Returns [{day, totalRemaining}, ...].
function buildHistoricalRemainingSeries(allData, historyRows) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const lastDay = now < START_DATE ? 1 : countBusinessDays(START_DATE, now);

  // Primary index: Campus|RoomNumber, matching the spreadsheet's own Key
  // formula. Secondary fallback index: Campus|SpaceName — used only when
  // the room-number lookup finds nothing, which covers a room's number
  // being assigned or changed in All Spaces after its original submission
  // was already logged (that submission has no room number to match on,
  // so it's only findable by name).
  const byRoomKey = {};
  const byNameKey = {};
  historyRows.forEach(r => {
    // Skip counts-only submissions (no assessment set) — matches the
    // spreadsheet's own "Latest Key With Assessment" column, which does the
    // same skip. Without this, a counts-only update submitted after a real
    // "Fully ready" assessment would look like the latest thing on record
    // for that room and wrongly read as blank/not-assessed, when the real
    // most recent assessment (still valid) is one submission further back.
    if (!r.assessment) return;
    const entry = { ts: r.ts, assessment: r.assessment };
    if (r.room) {
      const rk = r.campus + '|' + r.room;
      if (!byRoomKey[rk]) byRoomKey[rk] = [];
      byRoomKey[rk].push(entry);
    }
    const nk = r.campus + '|' + r.space;
    if (!byNameKey[nk]) byNameKey[nk] = [];
    byNameKey[nk].push(entry);
  });
  Object.keys(byRoomKey).forEach(k => byRoomKey[k].sort((a,b) => a.ts - b.ts));
  Object.keys(byNameKey).forEach(k => byNameKey[k].sort((a,b) => a.ts - b.ts));

  const allRooms = [];
  CAMPUSES.forEach(c => {
    const d = allData[c.code];
    if (!d || !d.rooms) return;
    d.rooms.forEach(r => {
      allRooms.push({
        roomKey: r.roomNumber ? (c.code + '|' + r.roomNumber) : null,
        nameKey: c.code + '|' + r.space,
        // A handful of spaces (e.g. Phone system, Network/WiFi) have "n/a"
        // typed directly into All Spaces rather than coming from any real
        // Ops Readiness Log submission — there's no history to find for
        // those at all. When that's the only information available, treat
        // it as a durable fact rather than "not yet assessed."
        liveIsNA: dotClass(r.SDO ? r.SDO.assessment : null) === 'dot-na',
        techAssessment: r.tech ? r.tech.assessment : null
      });
    });
  });

  const series = [];
  for (let day = 1; day <= lastDay; day++) {
    const cutoff = businessDayToDate(START_DATE, day).getTime() + 24*60*60*1000 - 1; // end of that calendar day
    let remaining = 0;
    allRooms.forEach(room => {
      let subs = room.roomKey ? (byRoomKey[room.roomKey] || []) : [];
      if (!subs.length) subs = byNameKey[room.nameKey] || [];
      let latest = null;
      for (let i = subs.length - 1; i >= 0; i--) {
        if (subs[i].ts <= cutoff) { latest = subs[i]; break; }
      }
      const sdoValue = latest ? latest.assessment : (room.liveIsNA ? 'n/a' : null);
      const cls = combinedStatusFromRaw(sdoValue, room.techAssessment);
      if (cls === 'dot-na' || cls === 'dot-ok') return;
      remaining++;
    });
    series.push({ day, totalRemaining: remaining });
  }
  return series;
}

// Returns { totalRemaining, bySection: { sectionName: {Anacostia,Benning,Edgewood} } }
// "Remaining" = a signoff (Operations or Tech) isn't yet confirmed Fully ready —
// each track is counted separately, so a room can contribute up to 2 remaining
// signoffs (one per track) if neither has been confirmed yet.
function computeSpacesRemaining(allData) {
  const bySection = {};
  let totalRemaining = 0;
  const tracks = ['SDO', 'tech'];
  CAMPUSES.forEach(c => {
    const d = allData[c.code];
    if (!d || !d.rooms) return;
    const cluster = CLUSTER_MAP[c.code];
    d.rooms.forEach(r => {
      tracks.forEach(track => {
        const rec = track === 'tech' ? r.tech : r[track];
        const cls = dotClass(rec ? rec.assessment : null);
        if (cls === 'dot-na' || cls === 'dot-ok') return;
        const sec = r.section || 'Other';
        if (!bySection[sec]) bySection[sec] = {Anacostia:0, Benning:0, Edgewood:0};
        bySection[sec][cluster]++;
        totalRemaining++;
      });
    });
  });
  return { totalRemaining, bySection };
}

function buildBurndownChart(totalRemaining) {
  if (!totalRemaining) {
    return `<div class="progress-block">
      <div class="progress-block-title">BURNDOWN</div>
      <div class="chart-headline"><span class="num">0</span><span class="lbl">signoff remaining — fully caught up!</span></div>
    </div>`;
  }
  const totalDays  = countBusinessDays(START_DATE, FDOS_DATE);
  const targetDay   = countBusinessDays(START_DATE, TARGET_DATE);
  const todayDay    = 1; // dashboard always computes "remaining" live, as of today

  const L = 40, R = 620, TOP = 40, BOT = 217;
  const xStep = (R - L) / (totalDays - 1);
  const xFor  = d => (L + (d - 1) * xStep).toFixed(1);
  const yFor  = v => (BOT - (v / totalRemaining) * (BOT - TOP)).toFixed(1);

  let idealPts = [];

    idealPts.push(`${xFor(d)},${yFor(v)}`);

  const todayX = xFor(todayDay), targetX = xFor(targetDay), fdosX = xFor(totalDays);

  return `<div class="progress-block">

    <div class="chart-headline"><span class="num">${totalRemaining}</span><span class="lbl">signoff remaining</span></div>
    <div class="chart-legend">
      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#94a3b8"></span>Ideal pace</span>

    </div>
    <svg viewBox="0 0 680 232" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
      <line x1="40" y1="40"  x2="620" y2="40"  stroke="#f1f5f9" stroke-width="1"/>

      <line x1="40" y1="172" x2="620" y2="172" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="217" x2="620" y2="217" stroke="#cbd5e1" stroke-width="1.5"/>

      <text x="34" y="44"  font-size="10" fill="#94a3b8" text-anchor="end">${totalRemaining}</text>
      <text x="34" y="221" font-size="10" fill="#94a3b8" text-anchor="end">0</text>

      <line x1="${todayX}" y1="40" x2="${todayX}" y2="217" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="${todayX}" y="34" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">TODAY</text>

      <line x1="${targetX}" y1="40" x2="${targetX}" y2="217" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="${targetX}" y="14" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">TARGET FOR</text>
      <text x="${targetX}" y="29" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">100% READINESS</text>

      <line x1="${fdosX}" y1="40" x2="${fdosX}" y2="217" stroke="#E5A810" stroke-width="2"/>
      <text x="${fdosX}" y="14" font-size="12" fill="#E5A810" text-anchor="middle" font-weight="700">FIRST DAY OF</text>
      <text x="${fdosX}" y="29" font-size="12" fill="#E5A810" text-anchor="middle" font-weight="700">SCHOOL</text>

      <polyline points="${idealPts.join(' ')}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,5"/>
      <circle cx="${todayX}" cy="${todayY}" r="5" fill="#005E9E"/>

      <text x="40" y="230" font-size="10" fill="#94a3b8" text-anchor="middle">Jul 30</text>
      <text x="${targetX}" y="230" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Aug 18</text>
      <text x="${fdosX}" y="230" font-size="10" fill="#94a3b8" text-anchor="middle">Aug 24</text>
    </svg>
  </div>`;
}

function buildSpacesLeftChart(bySection, totalRemaining) {
  const sections = Object.entries(bySection)
    .map(([name, counts]) => ({ name, counts, total: counts.Anacostia + counts.Benning + counts.Edgewood }))
    .filter(s => s.total > 0)
    .sort((a, b) => b.total - a.total);

  if (!sections.length) return '';
  const maxTotal = sections[0].total;

  const rows = sections.map(s => {
    const widthPct = (s.total / maxTotal * 100).toFixed(1);
    const segs = ['Anacostia', 'Benning', 'Edgewood'].map(cl => {
      const n = s.counts[cl];
      if (!n) return '';
      const segPct = (n / s.total * 100).toFixed(1);
      return `<div class="cat-seg" style="width:${segPct}%;background:${CLUSTER_COLOR[cl]}">${n}</div>`;
    }).join('');
    return `<div class="cat-row">
      <span class="cat-label">${s.name}</span>
      <div class="cat-bar-outer"><div class="cat-bar-track" style="width:${widthPct}%">${segs}</div></div>
      <span class="cat-count">${s.total}</span>
    </div>`;
  }).join('');

  return `<div class="progress-block">
    <div class="progress-block-title">SIGNOFFS LEFT, BY CATEGORY</div>
    <div class="cat-legend">
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--blue)"></span>Anacostia</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--gold)"></span>Benning</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--green)"></span>Edgewood</span>
    </div>
    ${rows}
  </div>`;
}

// ── Spaces (combined) versions of the two charts above ─────────────────────
// Same structure as computeSpacesRemaining/buildBurndownChart/buildSpacesLeftChart,
// but a room only counts as "remaining" here if it's not Fully Ready by the
// combined-space definition (see combinedSpaceStatus) rather than per-track.
function computeSpaceRemaining(allData) {
  const bySection = {};
  let totalRemaining = 0;
  CAMPUSES.forEach(c => {
    const d = allData[c.code];
    if (!d || !d.rooms) return;
    const cluster = CLUSTER_MAP[c.code];
    d.rooms.forEach(r => {
      const cls = combinedSpaceStatus(r);
      if (cls === 'dot-na' || cls === 'dot-ok') return;
      const sec = r.section || 'Other';
      if (!bySection[sec]) bySection[sec] = {Anacostia:0, Benning:0, Edgewood:0};
      bySection[sec][cluster]++;
      totalRemaining++;
    });
  });
  return { totalRemaining, bySection };
}

function buildSpaceBurndownChart(historicalSeries, liveTotal) {
  if (!historicalSeries || !historicalSeries.length) {
    return `<div class="progress-block">
      <div class="progress-block-title">BURNDOWN</div>
      <div class="chart-headline"><span class="num">—</span><span class="lbl">no data yet</span></div>
    </div>`;
  }
  // The headline number is always the live, right-now total — same value
  // the category chart shows — not whatever the chart's last plotted point
  // happens to be. The chart only has a data point for each business day,
  // so over a weekend (or any day with no plotted point yet) the chart's
  // last dot can lag behind live reality until the next business day gets
  // added. Without this, the headline would silently disagree with the
  // category chart any time real progress happens outside business hours.
  const chartLastTotal = historicalSeries[historicalSeries.length - 1].totalRemaining;
  const totalRemaining = (typeof liveTotal === 'number') ? liveTotal : chartLastTotal;
  if (!totalRemaining) {
    return `<div class="progress-block">
      <div class="progress-block-title">BURNDOWN</div>
      <div class="chart-headline"><span class="num">0</span><span class="lbl">spaces remaining — fully caught up!</span></div>
    </div>`;
  }

  const totalDays = countBusinessDays(START_DATE, END_DATE);
  const targetDay  = countBusinessDays(START_DATE, TARGET_DATE);
  const fdosDay    = countBusinessDays(START_DATE, FDOS_DATE);
  const todayDay   = historicalSeries.length;
  const startTotal = historicalSeries[0].totalRemaining;
  const yMax = Math.max(...historicalSeries.map(p => p.totalRemaining), totalRemaining, 1);

  const L = 40, R = 620, TOP = 40, BOT = 217;
  const xStep = (R - L) / (totalDays - 1);
  const xFor  = d => (L + (d - 1) * xStep).toFixed(1);
  const yFor  = v => (BOT - (v / yMax) * (BOT - TOP)).toFixed(1);

  // Ideal pace: straight line from day 1's real starting total down to zero by target day
  let idealPts = [];
  for (let d = 1; d <= totalDays; d++) {
    const v = (d <= targetDay && targetDay > 1)
      ? startTotal * (1 - (d - 1) / (targetDay - 1))
      : 0;
    idealPts.push(`${xFor(d)},${yFor(v)}`);
  }

  // Actual: a real reconstructed point for every business day since Jul 30
  const actualPts = historicalSeries.map(p => `${xFor(p.day)},${yFor(p.totalRemaining)}`);

  const todayX = xFor(todayDay), targetX = xFor(targetDay), fdosX = xFor(fdosDay), endX = xFor(totalDays);
  const todayY = yFor(chartLastTotal);
  const liveDiffersFromChart = totalRemaining !== chartLastTotal;

  return `<div class="progress-block">
    <div class="progress-block-title">BURNDOWN</div>
    <div class="chart-headline"><span class="num">${totalRemaining}</span><span class="lbl">spaces remaining</span></div>
    <div class="chart-legend">
      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#94a3b8"></span>Ideal pace</span>

const SECONDARY_SECTIONS = ['Offices', 'Staff Common Spaces', 'Technology'];

function buildSpaceCategoryChart(bySection, totalRemaining) {
  function rowsFor(sectionNames) {
    return sectionNames
      .filter(name => bySection[name] && (bySection[name].Anacostia + bySection[name].Benning + bySection[name].Edgewood) > 0)
      .map(name => {
        const counts = bySection[name];
        return { name, counts, total: counts.Anacostia + counts.Benning + counts.Edgewood };
      });
  }

  const priorityRows  = rowsFor(PRIORITY_SECTIONS);
  const secondaryRows = rowsFor(SECONDARY_SECTIONS);
  const allRows = [...priorityRows, ...secondaryRows];
  if (!allRows.length) return '';

  // Both groups share the SAME max, so a bar's width means the same thing
  // whether it's in Priority or Secondary — not independently rescaled per group.
  const maxTotal = Math.max(...allRows.map(s => s.total));

  function renderRow(s) {
    const widthPct = (s.total / maxTotal * 100).toFixed(1);
    const segs = ['Anacostia', 'Benning', 'Edgewood'].map(cl => {
      const n = s.counts[cl];
      if (!n) return '';
      const segPct = (n / s.total * 100).toFixed(1);
      return `<div class="cat-seg" style="width:${segPct}%;background:${CLUSTER_COLOR[cl]}">${n}</div>`;
    }).join('');
    return `<div class="cat-row">
      <span class="cat-label">${s.name}</span>
      <div class="cat-bar-outer"><div class="cat-bar-track" style="width:${widthPct}%">${segs}</div></div>
      <span class="cat-count">${s.total}</span>
    </div>`;
  }

  const priorityHtml  = priorityRows.length  ? `<div class="subgroup-label">Priority</div>${priorityRows.map(renderRow).join('')}` : '';
  const secondaryHtml = secondaryRows.length ? `<div class="subgroup-label">Secondary</div>${secondaryRows.map(renderRow).join('')}` : '';

  return `<div class="progress-block">
    <div class="progress-block-title">SPACES LEFT, BY CATEGORY</div>
    <div class="cat-legend">
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--blue)"></span>Anacostia</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--gold)"></span>Benning</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--green)"></span>Edgewood</span>
    </div>
    ${priorityHtml}
    ${secondaryHtml}
  </div>`;
}

// ── EMC space map (subway-style dot layout) ────────────────────────────────
// Generates a rounded-corner SVG path through a sequence of [x,y] points —
// used for the left-side bent line below, so its corners read like a subway
// map bend rather than a sharp joint.
function roundedPathD(pts, radius) {
  if (pts.length < 2) return '';
  radius = radius || 14;
  let d = `M ${pts[0][0]},${pts[0][1]} `;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const d1 = Math.hypot(x1-x0, y1-y0) || 1, d2 = Math.hypot(x2-x1, y2-y1) || 1;
    const r = Math.min(radius, d1/2, d2/2);
    const p1x = x1 - (x1-x0)/d1*r, p1y = y1 - (y1-y0)/d1*r;
    const p2x = x1 + (x2-x1)/d2*r, p2y = y1 + (y2-y1)/d2*r;
    d += `L ${p1x},${p1y} Q ${x1},${y1} ${p2x},${p2y} `;
  }
  const last = pts[pts.length-1];
  d += `L ${last[0]},${last[1]}`;
  return d;
}

const MAP_STATUS_COLOR = {'dot-ok':'var(--green)','dot-minor':'var(--yellow)','dot-bad':'var(--red)',
  'dot-pending':'#378ADD','dot-blank':'#cbd5e1','dot-na':'#e2e8f0'};

function mapDotSvg(n, labelSide) {
  const color = MAP_STATUS_COLOR[n.cls] || '#cbd5e1';
  let textX, textY, anchor;
  if (n.labelOffset) {
    textX = n.x + n.labelOffset.x; textY = n.y + n.labelOffset.y;
    anchor = n.labelOffset.anchor || 'middle';
  } else {
    textX = labelSide === 'right' ? n.x + 14 : n.x - 14;
    textY = n.y + 4;
    anchor = labelSide === 'right' ? 'start' : 'end';
  }
  return `<circle id="${n.domId}" cx="${n.x}" cy="${n.y}" r="7" fill="${color}" stroke="#fff" stroke-width="1.5" style="transition:fill .3s"/>
    <text x="${textX}" y="${textY}" font-size="11" fill="var(--text)" text-anchor="${anchor}">${n.label}</text>`;
}

// A plain geometry vertex — bends the path but has no dot or label. Used so
// rooms can sit along a straight run instead of exactly at a turn, the way
// stations sit between bends on a real subway map rather than at every one.
function corner(x, y) { return { x, y, isCorner: true }; }

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function mapNodeLookup(rooms, floorKey) {
  const byRoom = {}, bySpace = {};
  rooms.forEach(r => {
    if (r.roomNumber) byRoom[r.roomNumber] = r;
    bySpace[r.space.toLowerCase()] = r;
  });
  return {
    byNumber(roomNumber, fallbackLabel) {
      const r = byRoom[roomNumber];
      const domId = `mapdot-${floorKey}-${slug(roomNumber)}`;
      if (!r) return { label: fallbackLabel || `Room ${roomNumber}`, cls: 'dot-blank', domId, roomNumber };
      return { label: r.space + (r.roomNumber ? ` (${r.roomNumber})` : ''), cls: mapRoomStatus(r), domId, roomNumber };
    },
    bySpaceName(name, fallbackLabel) {
      const r = bySpace[name.toLowerCase()];
      const domId = `mapdot-${floorKey}-${slug(name)}`;
      if (!r) return { label: fallbackLabel || name, cls: 'dot-blank', domId, roomNumber: null };
      return { label: r.space, cls: mapRoomStatus(r), domId, roomNumber: r.roomNumber || null };
    },
    fromRoom(r) {
      const key = r.roomNumber || slug(r.space);
      return { label: r.space, cls: mapRoomStatus(r), domId: `mapdot-${floorKey}-${slug(key)}`, roomNumber: r.roomNumber || null };
    }
  };
}

// Both EMC floor maps are drawn as ONE continuous closed loop — not two
// separate lines joined at a corner. Straight rails, real corner() vertices
// only where the path actually turns, rooms placed along the straight runs
// between them wherever possible.
function buildEMCLoop(title, loopNodes, viewW) {
  const maxY = Math.max(...loopNodes.map(n => n.y)) + 40;
  const pathPts = loopNodes.map(n => [n.x, n.y]).concat([[loopNodes[0].x, loopNodes[0].y]]); // close back to start
  const dots = loopNodes.filter(n => !n.isCorner).map(n => mapDotSvg(n, n.labelSide || 'right')).join('');
  // FIXED: .progress-block-title uses negative side margins to bleed
  // edge-to-edge inside the full-width .main container — that breaks once
  // the block is a narrower flex sibling instead (the two titles bled into
  // each other, which is what "stacking" was). This is a local title bar
  // scoped to its own block's width instead.
  // FIXED: .progress-block's CSS gives every instance margin-top:32px
  // except the actual :first-child of its parent — inside this flex row,
  // that's only ever the left map. The right one kept its 32px push down,
  // which is exactly the "right side a few pixels lower" you saw. Zeroing
  // it explicitly here instead of leaning on :first-child fixes both.
  return `<div class="progress-block" style="flex:1 1 340px;min-width:0;margin-top:0">
    <div style="font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#0C447C;background:#E6F1FB;padding:8px 12px;margin:0 0 14px;border-radius:6px">${title}</div>
    <svg viewBox="0 0 ${viewW} ${maxY}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
      <path d="${roundedPathD(pathPts, 20)}" fill="none" stroke="var(--border)" stroke-width="1.5"/>
      ${dots}
    </svg>
  </div>`;
}

// Both floors share the same top-line width and left/right rail x-positions
// — same building footprint on both levels — so the two maps read as the
// same shape. Only the number of stops along each rail, and what happens
// at the bottom, differs per floor's real layout.
const EMC_FRAME = {
  leftBottomCorner:  [165, 400],
  leftTopCorner:     [215, 105],
  rightTopCorner:    [335, 105],
  rightBottomY:      400
};

// n points strictly BETWEEN p0 and p1 — excludes both endpoints, so rooms
// placed this way never land exactly on a corner.
function interpolateBetween(p0, p1, n) {
  const pts = [];
  for (let i = 1; i <= n; i++) {
    const t = i / (n + 1);
    pts.push([p0[0] + (p1[0]-p0[0])*t, p0[1] + (p1[1]-p0[1])*t]);
  }
  return pts;
}

// Guarantees three restroom slots always show, even if the section/name
// filter below finds fewer than three in the live data — "add back" means
// they should always be present, not conditionally present. Any slot the
// filter didn't find just renders blank (no data found) rather than
// disappearing outright.
// FIXED: the floor indicator ("1st floor - A", "2nd floor - B", etc.)
// lives in the Room # column, not the Space name — the space name is just
// "Girls restroom" / "Boys restroom" / "Staff restroom" with no floor info
// in it at all. Matching against r.space (as before) could never work; the
// location itself is intentionally never shown as a label (would be
// confusing on a map already split by floor) — it's only used here to sort
// each restroom onto the right floor.
function restroomSlots(rooms, floorRegex, floorKey) {
  const TYPES = [
    { match: /girls/i, label: 'Girls restroom' },
    { match: /boys/i,  label: 'Boys restroom' },
    { match: /staff/i, label: 'Staff restroom' }
  ];
  return TYPES.map((t, i) => {
    const domId = `mapdot-${floorKey}-restroom-${i}`;
    const r = rooms.find(rm => rm.section === 'Restrooms' && t.match.test(rm.space) && floorRegex.test(rm.roomNumber || ''));
    if (!r) return { label: t.label, cls: 'dot-blank', domId, roomNumber: null };
    return { label: r.space, cls: mapRoomStatus(r), domId, roomNumber: r.roomNumber || null };
  });
}

// Edgewood Middle, 1st floor. One continuous loop: a straight left rail
// (107-108-109-110) and straight right rail (115 through 100), joined by a
// horizontal line at the top with 112 sitting on it (not at either corner),
// and a short closing run at the bottom where 100 and 101 share the same
// height — real building constraint, not a style choice. Room 111 is
// intentionally omitted — it's not a separate tracked space; the door
// there opens into 110's room, not a distinct room of its own.
//
// Restroom matching against your real data is confirmed (see
// restroomSlots' comment) — Lobby/Main entrance name matching on the 2nd
// floor is still unverified.
function buildEMCLowerMap(emcData) {
  const rooms = (emcData && emcData.rooms) || [];
  if (!rooms.length) return { html: '', nodes: [] };
  const L = mapNodeLookup(rooms, 'lower');
  const restroomNodes = restroomSlots(rooms, /1st|lower/i, 'lower');

  const n107 = L.byNumber('107'), n108 = L.byNumber('108'), n109 = L.byNumber('109'), n110 = L.byNumber('110');
  const n112 = L.byNumber('112');
  const n115 = L.byNumber('115'), n119 = L.byNumber('119'), n120 = L.byNumber('120'), n121 = L.byNumber('121');
  const n135B = L.byNumber('135B'), n135A = L.byNumber('135A'), n100 = L.byNumber('100');
  const n101 = L.byNumber('101'), n105 = L.byNumber('105');

  const cBotL = corner(...EMC_FRAME.leftBottomCorner);
  const cTopL = corner(...EMC_FRAME.leftTopCorner);
  const cTopR = corner(...EMC_FRAME.rightTopCorner);

  // Left rail: 107, 108, 109, 110 — strictly between the two left corners.
  const leftRoomPts = interpolateBetween(EMC_FRAME.leftBottomCorner, EMC_FRAME.leftTopCorner, 4);
  [n107, n108, n109, n110].forEach((n, i) => { [n.x, n.y] = leftRoomPts[i]; n.labelSide = 'left'; });

  // Top line: horizontal, 112 at the midpoint — not at either corner.
  n112.x = (EMC_FRAME.leftTopCorner[0] + EMC_FRAME.rightTopCorner[0]) / 2;
  n112.y = EMC_FRAME.leftTopCorner[1];
  n112.labelSide = 'right'; n112.labelOffset = { x: 0, y: -14, anchor: 'middle' };

  // Right rail: 115, 119, 120, 121, restrooms, 135B, 135A — strictly
  // between the top-right corner and 100 (100 itself sits at the bottom of
  // the rail, since it has to share a height with 101 right after it).
  const rightRoomList = [n115, n119, n120, n121, ...restroomNodes, n135B, n135A];
  const rightRoomPts  = interpolateBetween(EMC_FRAME.rightTopCorner, [EMC_FRAME.rightTopCorner[0], EMC_FRAME.rightBottomY], rightRoomList.length);
  rightRoomList.forEach((n, i) => { [n.x, n.y] = rightRoomPts[i]; n.labelSide = 'right'; });
  n100.x = EMC_FRAME.rightTopCorner[0]; n100.y = EMC_FRAME.rightBottomY; n100.labelSide = 'right';

  // Bottom: 101 sits at the same height as 100 (Gym / Princeton), then
  // 105 above 101, closing back toward the left rail's bottom corner.
  n101.x = 250; n101.y = EMC_FRAME.rightBottomY; n101.labelSide = 'left';
  n105.x = 250; n105.y = EMC_FRAME.rightBottomY - 45; n105.labelSide = 'right';

  const loop = [cBotL, n107, n108, n109, n110, cTopL, n112, cTopR, ...rightRoomList, n100, n101, n105];
  return { html: buildEMCLoop('EDGEWOOD MIDDLE — SPACE MAP (1ST FLOOR)', loop, 520), nodes: loop.filter(n => !n.isCorner) };
}

// Edgewood Middle, 2nd floor — same top-line width and rail x-positions as
// the 1st floor, so the outer shape reads as the same building; only the
// stop count and the bottom cluster differ, per the real layout: the
// corner sits below 205 (the rail's bottom room, same pattern as 107 on
// the floor below), 218 sits on the horizontal top line, 201/Main Entrance
// continue straight down the right rail past 238, and a corner to the
// Lobby's right carries the path from Main Entrance over to the Lobby →
// 203 → back to 205's corner.
//
// Restroom matching against your real data is confirmed (see
// restroomSlots' comment). Still unverified: "Lobby" and "Main entrance"
// are assumed to be the exact space names used in All Spaces for those
// rooms.
function buildEMCUpperMap(emcData) {
  const rooms = (emcData && emcData.rooms) || [];
  if (!rooms.length) return { html: '', nodes: [] };
  const L = mapNodeLookup(rooms, 'upper');
  const restroomNodes = restroomSlots(rooms, /2nd|upper/i, 'upper');

  const cBotL = corner(...EMC_FRAME.leftBottomCorner);
  const cTopL = corner(...EMC_FRAME.leftTopCorner);
  const cTopR = corner(...EMC_FRAME.rightTopCorner);

  const leftKeys = ['205','207','208','209','212','213','214','215','216','217'];
  const leftRail = leftKeys.map(k => L.byNumber(k)); // already bottom(205) to top(217)
  const leftPts  = interpolateBetween(EMC_FRAME.leftBottomCorner, EMC_FRAME.leftTopCorner, leftRail.length);
  leftRail.forEach((n, i) => { [n.x, n.y] = leftPts[i]; n.labelSide = 'left'; });

  const n218 = L.byNumber('218');
  n218.x = (EMC_FRAME.leftTopCorner[0] + EMC_FRAME.rightTopCorner[0]) / 2;
  n218.y = EMC_FRAME.leftTopCorner[1];
  n218.labelSide = 'right'; n218.labelOffset = { x: 0, y: -14, anchor: 'middle' };

  const n219 = L.byNumber('219'), n220 = L.byNumber('220'), n221 = L.byNumber('221');
  const n238 = L.byNumber('238');
  const n201 = L.byNumber('201', 'Front office');
  const nMain = L.bySpaceName('Main entrance', 'Main entrance');
  // 201 (front desk / Front office) rides the same right vertical line,
  // between the cafeteria and Main Entrance — not a separate branch.
  const rightRoomList = [n219, n220, n221, ...restroomNodes, n238, n201];
  const rightRoomPts  = interpolateBetween(EMC_FRAME.rightTopCorner, [EMC_FRAME.rightTopCorner[0], EMC_FRAME.rightBottomY], rightRoomList.length);
  rightRoomList.forEach((n, i) => { [n.x, n.y] = rightRoomPts[i]; n.labelSide = 'right'; });
  nMain.x = EMC_FRAME.rightTopCorner[0]; nMain.y = EMC_FRAME.rightBottomY; nMain.labelSide = 'right';

  // Corner to the Lobby's right, carrying the path from Main Entrance back
  // toward the Lobby cluster.
  const cRightOfLobby = corner(280, EMC_FRAME.rightBottomY);

  const nLobby = L.bySpaceName('Lobby');
  nLobby.x = 240; nLobby.y = EMC_FRAME.rightBottomY - 20;
  // Label placed above rather than beside — the corner, 203, and the
  // closing run to 205 all sit close by on this side, so a side label
  // would run into one of them.
  nLobby.labelOffset = { x: 0, y: -14, anchor: 'middle' };

  const n203 = L.byNumber('203', 'Conference room');
  n203.x = 200; n203.y = EMC_FRAME.rightBottomY; n203.labelSide = 'left'; // on the path between the Lobby and 205's corner

  const loop = [cBotL, ...leftRail, cTopL, n218, cTopR, ...rightRoomList, nMain, cRightOfLobby, nLobby, n203];
  return { html: buildEMCLoop('EDGEWOOD MIDDLE — SPACE MAP (2ND FLOOR)', loop, 520), nodes: loop.filter(n => !n.isCorner) };
}

// ── EMC map timeline (play/scrub through history) ───────────────────────────
// Reconstructs each tracked room's status for every business day from
// START_DATE to today, from the same raw Ops Readiness Log rows the
// burndown chart uses — same honesty caveat as everywhere else this data
// is used: only Ops (SDO) has real history, so past days reflect the Ops
// track only, not Tech. "Today" on the slider therefore intentionally
// matches that same Ops-only reconstruction (not the live Ops+Tech combined
// color the map shows before you touch the slider), so scrubbing doesn't
// jump between two different definitions of "current."
function buildEMCRoomHistory(historyRows, roomNumbers) {
  const byRoomKey = {};
  (historyRows || []).forEach(r => {
    if (r.campus !== 'EMC' || !r.room || !r.assessment) return;
    if (!byRoomKey[r.room]) byRoomKey[r.room] = [];
    byRoomKey[r.room].push({ ts: r.ts, assessment: r.assessment });
  });
  Object.keys(byRoomKey).forEach(k => byRoomKey[k].sort((a,b) => a.ts - b.ts));

  const now = new Date();
  now.setHours(0,0,0,0);
  const lastDay = now < START_DATE ? 1 : countBusinessDays(START_DATE, now);

  const series = []; // series[dayIndex] = { roomNumber: dotClass }
  for (let day = 1; day <= lastDay; day++) {
    const cutoff = businessDayToDate(START_DATE, day).getTime() + 24*60*60*1000 - 1;
    const dayStatus = {};
    roomNumbers.forEach(rn => {
      const subs = byRoomKey[rn] || [];
      let latest = null;
      for (let i = subs.length - 1; i >= 0; i--) {
        if (subs[i].ts <= cutoff) { latest = subs[i]; break; }
      }
      dayStatus[rn] = latest ? dotClass(latest.assessment) : 'dot-blank';
    });
    series.push(dayStatus);
  }
  return series;
}

function buildEMCTimelineControl() {
  return `<div class="progress-block">
    <div style="display:flex;align-items:center;gap:12px">
      <button id="emcPlayBtn" aria-label="Play" style="padding:6px 12px;border-radius:var(--radius,6px);border:1px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0">▶</button>
      <div id="emcSliderWrap" style="position:relative;flex:1">
        <input type="range" id="emcDaySlider" min="0" max="0" step="1" value="0" style="width:100%">
        <div id="emcDayLabel" style="position:absolute;top:20px;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)"></div>
      </div>
    </div>
    <div style="height:18px"></div>
  </div>`;
}

// Wires up the slider/play control against both floor maps' dot nodes.
// Only nodes with a real roomNumber can be animated (restrooms/Lobby have
// no clean history key and just stay at whatever their live status was
// when the panel loaded).
function initEMCTimeline(historyRows, allNodes) {
  const trackable = allNodes.filter(n => n.roomNumber);
  const roomNumbers = trackable.map(n => n.roomNumber);
  const series = buildEMCRoomHistory(historyRows, roomNumbers);
  const slider = document.getElementById('emcDaySlider');
  const label  = document.getElementById('emcDayLabel');
  const playBtn = document.getElementById('emcPlayBtn');
  if (!slider || !series.length) return;

  slider.max = series.length - 1;
  slider.value = series.length - 1;
  let playing = false, timer = null;

  // Positions the date label directly beneath the slider's thumb — thumbs
  // sit inset from the track's true edges by about half the thumb width,
  // so a plain percentage-of-width would drift outward at either end.
  function positionLabel() {
    const pct = series.length > 1 ? slider.value / (series.length - 1) : 0;
    const thumbInset = 8; // px, roughly half a typical thumb width
    const trackW = slider.offsetWidth - thumbInset * 2;
    label.style.left = `${thumbInset + pct * trackW}px`;
  }

  function render(dayIdx) {
    const dayStatus = series[dayIdx];
    trackable.forEach(n => {
      const el = document.getElementById(n.domId);
      if (!el) return;
      const cls = dayStatus[n.roomNumber] || 'dot-blank';
      el.setAttribute('fill', MAP_STATUS_COLOR[cls] || '#cbd5e1');
    });
    const d = businessDayToDate(START_DATE, dayIdx + 1);
    label.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    positionLabel();
  }

  slider.addEventListener('input', e => {
    render(parseInt(e.target.value, 10));
    if (playing) togglePlay();
  });
  window.addEventListener('resize', positionLabel);

  function togglePlay() {
    playing = !playing;
    playBtn.textContent = playing ? '⏸' : '▶';
    if (playing) {
      timer = setInterval(() => {
        let v = parseInt(slider.value, 10) + 1;
        if (v > series.length - 1) v = 0;
        slider.value = v;
        render(v);
      }, 600);
    } else {
      clearInterval(timer);
    }
  }
  playBtn.addEventListener('click', togglePlay);

  render(series.length - 1);
}

// ── Data fetching ─────────────────────────────────────────────────────────────

// NOTE: previously cached indefinitely per session, meaning a long-open tab
// could silently drift out of sync with reality (and with other dashboards
// that always fetch fresh). Always fetching live now instead.
// Short-TTL cache: fast on quick repeat visits (switching tabs back and
// forth), but never stale for long — unlike the old indefinite session
// cache, which could silently drift out of sync the longer a tab stayed open.
const CACHE_TTL_MS = 30000;
const _campusCache = {};
async function fetchCampus(code) {
  const cached = _campusCache[code];
  if (cached && (Date.now() - cached.at) < CACHE_TTL_MS) return cached.data;
  const url = `${SCRIPT_URL}?view=boy&campus=${code}`;
  const res  = await fetch(url);
  const data = await res.json();
  _campusCache[code] = { data, at: Date.now() };
  return data;
}

async function loadCampusPanel(code) {
  const panel = document.getElementById(`panel-${code}`);
  panel.innerHTML = '<div class="main">' + loadingBlock('Loading…') + '</div>';
  try {
    const data = await fetchCampus(code);
    if (!data.rooms || !data.rooms.length) {
      panel.innerHTML = '<div class="main"><div class="empty-msg">No submissions yet for ' + code + '.</div></div>';
      return;
    }
    let emcHtml = '', emcNodes = [];
    if (code === 'EMC') {
      const lower = buildEMCLowerMap(data);
      const upper = buildEMCUpperMap(data);
      // flex-wrap: side by side once there's room for both (≈700px+),
      // stacked below that — same breakpoint behavior as the rest of the
      // dashboard's responsive blocks.
      emcHtml  = `<div style="display:flex;flex-wrap:wrap;gap:20px;margin-top:32px">${lower.html}${upper.html}</div>${buildEMCTimelineControl()}`;
      emcNodes = lower.nodes.concat(upper.nodes);
    }

    let bodyHtml;
    if (code === 'EEC') {
      // Card view only — the sectioned table is intentionally hidden here so
      // the network can see this alternate layout in real daily use, not
      // just as a toggle option.
      bodyHtml = buildCampusProgress(data.rooms) + buildRoomCardStacks(data.rooms);
    } else if (code === 'BMC') {
      // Bucketed status squares — see buildBucketedSquares() for why BMC
      // gets its own layout (college-named classrooms).
      bodyHtml = buildCampusProgress(data.rooms) + buildBucketedSquares(data.rooms);
    } else if (code === 'AEC') {
      // Spin-wheel space selector — replaces the interactive floor map for
      // AEC only (AMC keeps the map below). All spaces on one ring,
      // grouped into contiguous arcs by SECTION_ORDER; buildAECWheel()
      // returns the skeleton, renderAECWheel() does the real layout work
      // once it's actually in the DOM (same two-pass pattern as the map).
      bodyHtml = buildCampusProgress(data.rooms) + buildAECWheel();
    } else if (code === 'AMC') {
      // Bubble space selector — replaces the interactive floor map for
      // AMC. All spaces packed together as one organic mass (not grouped
      // by section spatially — nested per-section packing produced a
      // rigid, grid-like arrangement of separate islands no matter how
      // tight the padding was). Bubble size is derived from how much
      // room each space's name needs at a constant font, not the other
      // way around — see buildAMCBubbles()/renderAMCBubbles().
      bodyHtml = buildCampusProgress(data.rooms) + buildAMCBubbles();
    } else {
      bodyHtml = buildCampusProgress(data.rooms) + emcHtml + buildSectionedTables(data.rooms);
    }
    panel.innerHTML = `<div class="main">${bodyHtml}</div>`;
    document.getElementById('hdr-meta').textContent = `SY 2026–27 · ${data.generated || ''}`;

    if (code === 'EMC') {
      // Fetched after the maps render (not blocking the initial paint) —
      // dots already show today's live combined status; the slider then
      // takes over once history is in.
      fetchReadinessHistory().then(h => initEMCTimeline(h.rows || [], emcNodes)).catch(() => {});
    } else if (code === 'AEC') {
      // Wheel container now exists in the DOM — safe to measure its real
      // width and lay out the ring.
      renderAECWheel(data.rooms);
    } else if (code === 'AMC') {
      // Bubble field now exists in the DOM — safe to measure its real
      // width and lay out the pack.
      renderAMCBubbles(data.rooms);
    }
  } catch(e) {
    panel.innerHTML = `<div class="main"><div class="empty-msg" style="color:var(--red)">Error loading ${code} data. Check the Apps Script URL.</div></div>`;
  }
}

async function loadOverall() {
  const el = document.getElementById('overall-main');
  el.innerHTML = loadingBlock('Loading all campuses…');
  try {
    // ONE request instead of 9 (was: 6 campuses + history + snapshots + wins,
    // each re-reading All Spaces from scratch). The Apps Script now reads All
    // Spaces once, cached 60s, and buckets every campus server-side.
    const overallData = await fetchOverallData();

    const allData = {};
    CAMPUSES.forEach(c => {
      allData[c.code] = (overallData.campuses && overallData.campuses[c.code]) || {rooms:[], summary:{}};
      // Warm the per-campus client cache too, so tapping into a campus tab
      // right after landing on Overall doesn't trigger its own fetch.
      _campusCache[c.code] = { data: allData[c.code], at: Date.now() };
    });
    const historyData  = overallData.history   || {rows:[]};
    const snapshotData = overallData.snapshots || {rows:[]};
    const winsData      = overallData.wins      || {rows:[]};

    const { totalRemaining: totalSpaceRemaining, bySection: bySectionSpace } = computeSpaceRemaining(allData);

    // Render what's cheap and already available right away — Today's Wins
    // and the KPI summary don't need the historical reconstruction below,
    // so there's no reason to make them wait on it.
    el.innerHTML = buildTodaysWins(winsData.rows || [])
      + buildOverall(allData)
      + '<div id="burndown-slot"></div>'
      + '<div id="category-slot"></div>';
    document.getElementById('hdr-meta').textContent = `SY 2026–27 · ${overallData.generated || ''}`;

    // The historical-series reconstruction runs on the next frame, so the
    // browser gets to paint the section above first instead of everything
    // appearing at once after one longer block.
    requestAnimationFrame(() => {
      let historicalSeries = [];
      try {
        // If real snapshots already cover every business day so far, skip the
        // (increasingly large, as the log grows) raw-history reconstruction
        // entirely — no need to crunch data we're about to overwrite anyway.
        const now = new Date();
        now.setHours(0,0,0,0);
        const lastDay = now < START_DATE ? 1 : countBusinessDays(START_DATE, now);
        const snapshotDays = new Set((snapshotData.rows || []).map(s => {
          const d = new Date(s.ts); d.setHours(0,0,0,0);
          return d < START_DATE ? null : countBusinessDays(START_DATE, d);
        }).filter(Boolean));
        const fullyCovered = snapshotDays.size >= lastDay;

        const reconstructed = fullyCovered
          ? Array.from({length: lastDay}, (_, i) => ({day: i+1, totalRemaining: 0}))
          : buildHistoricalRemainingSeries(allData, historyData.rows || []);
        historicalSeries = mergeWithSnapshots(reconstructed, snapshotData.rows || []);
      } catch(e) { historicalSeries = []; }

      document.getElementById('burndown-slot').outerHTML  = buildSpaceBurndownChart(historicalSeries, totalSpaceRemaining);
      document.getElementById('category-slot').outerHTML  = buildSpaceCategoryChart(bySectionSpace, totalSpaceRemaining);
      animateBurndownLine();
    });
  } catch(e) {
    el.innerHTML = '<div class="empty-msg" style="color:var(--red)">Error loading data.</div>';
  } finally {
    const overlay = document.getElementById('app-loading-overlay');
    if (overlay) overlay.classList.add('hidden');
  }
}

// Draws the burndown chart's "actual" line in from left to right on load,
// instead of it just appearing fully formed. Classic SVG technique: measure
// the path's real length, hide it behind its own dash gap, then animate the
// gap closing.
//
// FIXED: originally forced a reflow and set the transition in the same
// synchronous block, which some browsers can still batch into a single
// style recalculation — skipping straight to the end state with no visible
// animation. A double requestAnimationFrame (start hidden → let one frame
// actually paint that state → then switch on the transition) is the
// reliable way to guarantee the "before" state is committed first.
function animateBurndownLine() {
  const line = document.getElementById('actualLine');
  const dot  = document.getElementById('todayDot');
  if (!line) return;
  const len = line.getTotalLength();
  line.style.transition = 'none';
  line.style.strokeDasharray  = len;
  line.style.strokeDashoffset = len;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      line.style.transition = 'stroke-dashoffset 1.1s ease-out';
      line.style.strokeDashoffset = '0';
      if (dot) {
        dot.style.transition = 'opacity .3s ease-out';
        setTimeout(() => { dot.style.opacity = '1'; }, 900);
      }
    });
  });
}

// ── Tab switching ─────────────────────────────────────────────────────────────
const loaded = new Set();

// Re-render the interactive map / wheel on resize, using the cached data
// rather than refetching — same debounce pattern as positionLabel's
// resize listener elsewhere in this file.
let _cmResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_cmResizeTimer);
  _cmResizeTimer = setTimeout(() => {
    const activePanel = document.querySelector('.tab-panel.active');
    if (!activePanel) return;
    const code = activePanel.id.replace('panel-', '');
    if (code === 'AMC' && _campusCache[code]) {
      renderAMCBubbles(_campusCache[code].data.rooms);
    } else if (code === 'AEC' && _campusCache[code]) {
      positionWheelNodes();
    }
  }, 150);
});

function showTab(id, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.campus-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  el.classList.add('active');

  if (!loaded.has(id)) {
    loaded.add(id);
    if (id === 'overall') {
      loadOverall();
    } else {
      loadCampusPanel(id);
    }
  }
}

// ── Boot: load overall on page open ──────────────────────────────────────────
loaded.add('overall');
loadOverall();
</script>
</body>
</html>
