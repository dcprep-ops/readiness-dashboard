<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOY Readiness Dashboard</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:image" content="share.png">
<meta property="og:title" content="BOY Space Readiness">
<meta property="og:description" content="DC Prep BOY Space Readiness Dashboard — SY 2026–27">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="share.png">
<style>
:root{
  --blue:#005E9E;--blue-web:#0083C4;--gold:#E5A810;
  --green:#16a34a;--yellow:#ffd65a;--red:#dc2626;
  --border:rgba(0,94,158,.1);--bg:#F4F7FA;--card:#fff;
  --lt:#EBF3FB;--text:#1A2B3C;--muted:#6B8299;
  --col-mds:var(--blue);--col-sdo:#7c3aed;--col-dof:#b45309;--col-dot:#0891b2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:var(--text);min-height:100vh}

/* ── header ── */
.hdr{background:var(--blue);position:sticky;top:0;z-index:100}
.hdr-gold{height:5px;background:var(--gold)}
.hdr-inner{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-brand{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:2px}
.hdr-title{font-size:18px;font-weight:700;color:#fff}
.hdr-meta{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}

/* campus tabs */
.campus-tabs{display:flex;gap:0;overflow-x:auto;background:rgba(0,0,0,.15);padding:0 12px}
.campus-tab{font-size:12px;font-weight:600;color:rgba(255,255,255,.55);padding:9px 0;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;flex:1;text-align:center;min-width:0;transition:color .15s}
.campus-tab.active{color:#fff;border-bottom-color:var(--gold)}
.campus-tab.sep{border-right:1px solid rgba(255,255,255,.15);padding-right:0;margin-right:0}

/* ── legend ── */
.legend{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.legend-title{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-right:4px;white-space:nowrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}

/* ── dots ── */
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;line-height:1}
.dot-ok    {background:var(--green); color:#fff}
.dot-minor {background:var(--yellow);color:#1A2B3C}
.dot-bad   {background:var(--red);   color:#fff}
.dot-blank {background:#fff;border:1.5px solid #cbd5e1}
.dot-na    {background:var(--lt);color:var(--muted);font-size:8px;font-weight:600}
.dot-pending {background:#378ADD;color:#fff}

/* ── main ── */
.main{max-width:1100px;margin:0 auto;padding:16px 20px 40px}
.tab-panel{display:none}.tab-panel.active{display:block}
.section-block{margin-bottom:10px}
.section-hdr{font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#0C447C;background:#E6F1FB;padding:8px 20px;margin:28px -20px 10px}
.section-block:first-child .section-hdr{margin-top:0}

/* ── space table ── */
.space-table{width:100%;border-collapse:collapse}
.space-table th{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:6px 12px;border-bottom:0.5px solid var(--border);text-align:left}
.space-table th.sc{text-align:center;width:62px;padding:6px 4px}
.space-table td{padding:7px 12px;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
.space-table th:first-child, .space-table td:first-child{padding-left:0}
.space-table th.sc:last-child, .space-table td.sc:last-child{padding-right:0}
.space-table tr:last-child td{border-bottom:none}
.space-table tr:hover td{background:#f8fbff}
.space-table td.sc{text-align:center;vertical-align:middle;padding:7px 4px}
.space-name{font-weight:500}
.space-room-num{font-weight:400;font-size:13px;color:#B8C0CC}
.space-table tr.tight td{border-bottom:none}
.space-counts-row td{padding:0 12px 8px;font-size:11px;color:var(--muted)}

/* ── loading / error states ── */
.loading-row td{color:var(--muted);font-style:italic;text-align:center;padding:20px}
.empty-msg{color:var(--muted);font-size:13px;padding:40px 0;text-align:center}
.loading-ring-wrap{position:relative;width:56px;height:56px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.loading-ring{position:absolute;inset:0;border:3px solid var(--border);border-top-color:var(--blue-web);border-radius:50%;animation:loadingSpin .8s linear infinite}
.loading-icon{width:28px;height:28px;border-radius:6px;position:relative;z-index:1}
@keyframes loadingSpin{to{transform:rotate(360deg)}}

/* ── full-screen initial load overlay ── */
#app-loading-overlay{position:fixed;inset:0;z-index:9999;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
#app-loading-overlay .app-loading-title{font-family:Rockwell,'Rockwell Nova','Roboto Slab',serif;font-size:23px;font-weight:700;color:#fff;text-align:center;margin-bottom:28px;letter-spacing:.2px;padding:0 20px;line-height:1.25}
#app-loading-overlay .loading-ring-wrap{width:104px;height:104px;margin:0 0 18px}
#app-loading-overlay .loading-ring{border:5px solid rgba(255,255,255,.25);border-top-color:var(--gold)}
#app-loading-overlay .loading-icon{width:52px;height:52px;border-radius:11px}
#app-loading-overlay .app-loading-text{font-size:15px;color:rgba(255,255,255,.85)}
#app-loading-overlay.hidden{opacity:0;pointer-events:none}

/* ── overall tab — vertical KPI cards ── */
.net-summary{padding:20px 0 16px;margin-bottom:24px}
.net-summary-title{font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#0C447C;background:#E6F1FB;padding:8px 20px;margin:0 -20px 14px}
.bar-legend{display:flex;gap:16px;margin-bottom:16px}
.bar-legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.bar-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kpi-list{display:flex;flex-direction:column;gap:14px}
.kpi-card{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-name{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kpi-pct{font-size:28px;font-weight:700;color:var(--text);line-height:1;margin-bottom:12px}
.kpi-pct-unit{font-size:16px;color:var(--muted);font-weight:400}
.kpi-bar-track{height:36px;background:rgba(0,0,0,.07);border-radius:8px;overflow:hidden;display:flex}
.kpi-needed{font-size:12px;color:var(--text);font-weight:400;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.kpi-needed-num{font-weight:400;color:var(--text)}
.seg-ok{background:var(--green);height:100%;display:flex;align-items:center;padding:0 10px}
.seg-pending{background:#378ADD;height:100%;display:flex;align-items:center;padding:0 8px}
.seg-mn{background:var(--yellow);height:100%;display:flex;align-items:center;padding:0 8px}
.seg-label-ok{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.seg-label-pending{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.seg-label-mn{font-size:12px;font-weight:600;color:#78350f;white-space:nowrap;overflow:hidden}

/* Total Progress: burndown + spaces-by-category */
.progress-block{margin-top:32px}
.progress-block-title{font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#0C447C;background:#E6F1FB;padding:8px 20px;margin:0 -20px 14px}
.chart-legend{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.chart-legend-swatch{width:14px;height:3px;border-radius:2px}
.chart-headline{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.chart-headline .num{font-size:28px;font-weight:700;color:var(--text)}
.chart-headline .lbl{font-size:13px;color:var(--muted)}
.cat-legend{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.cat-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.cat-legend-swatch{width:10px;height:10px;border-radius:2px}
.cat-row{display:flex;align-items:center;gap:8px;padding:9px 0}
.cat-label{width:90px;flex-shrink:0;font-size:12px;color:var(--text);font-weight:500;line-height:1.3}
@media(min-width:480px){
  .cat-row{gap:12px}
  .cat-label{width:170px;font-size:13px}
}
.cat-bar-track{flex:1;height:20px;background:var(--lt);border-radius:4px;overflow:hidden;display:flex}
.cat-seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.cat-count{width:34px;flex-shrink:0;text-align:right;font-size:13px;font-weight:600;color:var(--blue)}
.kpi-na{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-na-name{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kpi-na-note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div id="app-loading-overlay">
  <div class="app-loading-title">BOY Readiness Dashboard</div>
  <div class="loading-ring-wrap">
    <div class="loading-ring"></div>
    <img src="icon.png" alt="" class="loading-icon">
  </div>
  <div class="app-loading-text">Loading dashboard…</div>
</div>

<div class="hdr">
  <div class="hdr-gold"></div>
  <div class="hdr-inner">
    <div>
      <div class="hdr-brand">DC Prep</div>
      <div class="hdr-title">BOY Readiness Dashboard</div>
      <div class="hdr-meta" id="hdr-meta">SY 2026–27</div>
    </div>
  </div>
  <div class="campus-tabs" id="campus-tabs">
    <div class="campus-tab sep active" onclick="showTab('overall',this)">All</div>
    <div class="campus-tab" onclick="showTab('BEC',this)">BEC</div>
    <div class="campus-tab" onclick="showTab('BMC',this)">BMC</div>
    <div class="campus-tab" onclick="showTab('AEC',this)">AEC</div>
    <div class="campus-tab" onclick="showTab('AMC',this)">AMC</div>
    <div class="campus-tab" onclick="showTab('EEC',this)">EEC</div>
    <div class="campus-tab" onclick="showTab('EMC',this)">EMC</div>
  </div>
</div>

<!-- legend moved inline to campus tab panels -->

<!-- ── Overall Status panel ── -->
<div id="panel-overall" class="tab-panel active">
  <div class="main" id="overall-main">
    <div class="empty-msg">
      <div class="loading-ring-wrap">
        <div class="loading-ring"></div>
        <img src="icon.png" alt="" class="loading-icon">
      </div>
      <div>Loading…</div>
    </div>
  </div>
</div>

<!-- ── Campus panels (one per campus, built by JS) ── -->
<div id="panel-BEC" class="tab-panel"></div>
<div id="panel-BMC" class="tab-panel"></div>
<div id="panel-AEC" class="tab-panel"></div>
<div id="panel-AMC" class="tab-panel"></div>
<div id="panel-EEC" class="tab-panel"></div>
<div id="panel-EMC" class="tab-panel"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — paste your deployed Apps Script URL here
// ─────────────────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPbhFWpzKX6S6seb1c0QKplVM22LjZG6bkGMBnTNopry6dDr5YGtffKKR3EsFQ77n5BQ/exec';

function loadingBlock(msg) {
  return '<div class="empty-msg"><div class="loading-ring-wrap"><div class="loading-ring"></div><img src="icon.png" alt="" class="loading-icon"></div><div>' + msg + '</div></div>';
}

// Campus metadata
const CAMPUSES = [
  {code:'BEC', name:'Benning Elementary'},
  {code:'BMC', name:'Benning Middle'},
  {code:'AEC', name:'Anacostia Elementary'},
  {code:'AMC', name:'Anacostia Middle'},
  {code:'EEC', name:'Edgewood Elementary'},
  {code:'EMC', name:'Edgewood Middle'},
];

// Section order — Apps Script groups rooms into these sections via the
// "Section" column in All Spaces. Match those exact strings here.
const SECTION_ORDER = ['Classrooms','Shared Student Spaces','Restrooms','Common Spaces','Offices','Staff Common Spaces','Technology'];

// ── Data sources ──────────────────────────────────────────────────────────────
// MDS / SDO statuses come from boy-readiness submissions (getBOYReadiness).
// Tech status comes from the All Spaces tab col G (Tech helper column) which you
// maintain. The Apps Script getBOYReadiness already returns a `tech` field per
// room once that column is wired up; for now it falls back to null (not assessed).
//
// Classroom readiness (MDS) for classroom-section rooms additionally reads from
// the legacy `readiness` flow (Classroom Readiness tab) via getBOYReadiness —
// the Apps Script already merges those into the MDS field for classroom rows.
// ─────────────────────────────────────────────────────────────────────────────

// ── Dot helpers ───────────────────────────────────────────────────────────────
function dotClass(assessment) {
  if (!assessment) return 'dot-blank';
  const a = assessment.toLowerCase();
  if (a.includes('pending sdo signoff')) return 'dot-pending';
  if (a.includes('fully'))  return 'dot-ok';
  if (a.includes('minor'))  return 'dot-minor';
  if (a.includes('not ready')) return 'dot-bad';
  if (a === 'n/a' || a === 'na') return 'dot-na';
  if (a === 'ready') return 'dot-ok';           // Tech: "Ready"
  if (a === 'issues') return 'dot-bad';          // Tech: "Issues"
  if (a === 'resolved') return 'dot-ok';         // Tech: "Resolved"
  return 'dot-blank';
}

function dotLabel(cls) {
  if (cls === 'dot-ok')    return '✓';
  if (cls === 'dot-minor') return '';
  if (cls === 'dot-bad')   return '!';
  if (cls === 'dot-na')    return '—';
  if (cls === 'dot-pending') return '';
  return '';
}

function makeDot(assessment, size) {
  const cls = dotClass(assessment);
  const lbl = dotLabel(cls);
  const sz  = size || 22;
  return `<span class="dot ${cls}" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.45)}px">${lbl}</span>`;
}

// ── Table builder ─────────────────────────────────────────────────────────────
const INLINE_LEGEND = `
  <div style="display:flex;align-items:center;gap:14px;padding:10px 0 16px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase">Status</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-ok" style="width:18px;height:18px;font-size:9px">✓</span> Fully ready</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-pending" style="width:18px;height:18px;font-size:9px"></span> Pending SDO signoff</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-minor" style="width:18px;height:18px;font-size:9px"></span> Minor items</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-bad" style="width:18px;height:18px;font-size:9px">!</span> Not ready</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-blank" style="width:18px;height:18px"></span> Not assessed</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-na" style="width:18px;height:18px;font-size:8px">—</span> N/A</span>
  </div>`;

function buildSectionedTables(rooms) {
  const groups = {};
  rooms.forEach(r => {
    const sec = r.section || 'Other';
    if (!groups[sec]) groups[sec] = [];
    groups[sec].push(r);
  });

  const seenSections = new Set();
  let html = INLINE_LEGEND;

  const ordered = [...SECTION_ORDER, ...Object.keys(groups).filter(s => !SECTION_ORDER.includes(s))];
  ordered.forEach(sec => {
    if (!groups[sec] || seenSections.has(sec)) return;
    seenSections.add(sec);
    html += `
    <div class="section-block">
      <div class="section-hdr">${sec}</div>
      <table class="space-table">
        <thead><tr>
          <th>Space</th>
          <th class="sc">Ops</th>
          <th class="sc">Tech</th>
        </tr></thead>
        <tbody>`;
    groups[sec].forEach(r => {
      const hasCounts = sec === 'Classrooms' && (r.deskCount || r.chairCount);
      html += `<tr${hasCounts ? ' class="tight"' : ''}>
        <td><span class="space-name">${r.space}</span>${r.roomNumber ? ` <span class="space-room-num">(${r.roomNumber})</span>` : ''}</td>
        <td class="sc">${makeDot(r.SDO  ? r.SDO.assessment  : null)}</td>
        <td class="sc">${makeDot(r.tech ? r.tech.assessment : null)}</td>
      </tr>`;
      if (hasCounts) {
        html += `<tr class="space-counts-row"><td colspan="3">${r.deskCount || '—'} desks · ${r.chairCount || '—'} chairs</td></tr>`;
      }
    });
    html += `</tbody></table></div>`;
  });
  return html || '<div class="empty-msg">No spaces found for this campus.</div>';
}

// Per-campus signoff progress: counts individual signoff cells (Schools, Ops,
// Tech) across all rooms — not whole spaces — so partial adoption (e.g. Tech
// keeps logging even if Ops hasn't started using the app) still shows real
// progress. Schools/MDS is no longer part of readiness tracking.
function buildCampusProgress(rooms) {
  const tracks = ['SDO', 'tech'];
  let ok = 0, minor = 0, pending = 0, total = 0;
  rooms.forEach(r => {
    tracks.forEach(track => {
      const rec = track === 'tech' ? r.tech : r[track];
      const cls = dotClass(rec ? rec.assessment : null);
      if (cls === 'dot-na') return;
      total++;
      if (cls === 'dot-ok')      ok++;
      if (cls === 'dot-minor')  minor++;
      if (cls === 'dot-pending') pending++;
    });
  });
  if (!total) return '';
  const okPct      = Math.round(ok      / total * 100);
  const minorPct   = Math.round(minor   / total * 100);
  const pendingPct = Math.round(pending / total * 100);
  const combined = okPct + minorPct;
  const okSeg      = okPct      > 0 ? `<div class="seg-ok" style="width:${okPct}%"><span class="seg-label-ok">${okPct >= 8 ? okPct+'%' : ''}</span></div>` : '';
  const minorSeg   = minorPct   > 0 ? `<div class="seg-mn" style="width:${minorPct}%"><span class="seg-label-mn">${minorPct >= 8 ? minorPct+'%' : ''}</span></div>` : '';
  const pendingSeg = pendingPct > 0 ? `<div class="seg-pending" style="width:${pendingPct}%"><span class="seg-label-pending">${pendingPct >= 8 ? pendingPct+'%' : ''}</span></div>` : '';
  return `<div class="net-summary">
    <div class="net-summary-title">Signoff Progress</div>
    <div class="kpi-pct">${combined}<span class="kpi-pct-unit">%</span></div>
    <div class="kpi-bar-track" style="margin-bottom:24px">${okSeg}${pendingSeg}${minorSeg}</div>
  </div>`;
}

function buildOverall(allData) {
  function networkPcts(track) {
    let ok = 0, minor = 0, total = 0;
    CAMPUSES.forEach(c => {
      const d = allData[c.code];
      if (!d) return;
      d.rooms.forEach(r => {
        const rec = track === 'tech' ? r.tech : r[track];
        const cls = dotClass(rec ? rec.assessment : null);
        if (cls === 'dot-na') return;
        total++;
        if (cls === 'dot-ok')    ok++;
        if (cls === 'dot-minor') minor++;
      });
    });
    return total ? { ok: Math.round(ok/total*100), minor: Math.round(minor/total*100), total, okCount: ok, needed: total - ok } : null;
  }

  function networkSpacePcts() {
    let ok = 0, minor = 0, total = 0;
    CAMPUSES.forEach(c => {
      const d = allData[c.code];
      if (!d) return;
      d.rooms.forEach(r => {
        const cls = combinedSpaceStatus(r);
        if (cls === 'dot-na') return;
        total++;
        if (cls === 'dot-ok')    ok++;
        if (cls === 'dot-minor') minor++;
      });
    });
    return total ? { ok: Math.round(ok/total*100), minor: Math.round(minor/total*100), total, okCount: ok, needed: total - ok } : null;
  }

  const trackMeta = [
    {key:'SDO',  label:'Operations'},
    {key:'tech', label:'Tech'},
  ];

  const cardsHtml = trackMeta.map(t => {
    const p = networkPcts(t.key);
    if (!p) {
      return `<div class="kpi-na">
        <div class="kpi-na-name">${t.label}</div>
        <div class="kpi-na-note">Not yet assessed</div>
      </div>`;
    }
    const combined = p.ok + p.minor;
    // Only render segments when > 0 to avoid hairline color bleed
    const okSeg    = p.ok    > 0 ? `<div class="seg-ok" style="width:${p.ok}%"><span class="seg-label-ok">${p.ok >= 8 ? p.ok+'%' : ''}</span></div>` : '';
    const minorSeg = p.minor > 0 ? `<div class="seg-mn" style="width:${p.minor}%"><span class="seg-label-mn">${p.minor >= 8 ? p.minor+'%' : ''}</span></div>` : '';
    return `<div class="kpi-card">
      <div class="kpi-name">${t.label}</div>
      <div class="kpi-pct">${combined}<span class="kpi-pct-unit">%</span></div>
      <div class="kpi-bar-track">${okSeg}${minorSeg}</div>
      <div class="kpi-needed"><span class="kpi-needed-num">${p.needed}</span> signoffs needed</div>
    </div>`;
  }).join('');

  const spaceP = networkSpacePcts();
  let spaceBarHtml = '';
  if (spaceP) {
    const spaceCombined = spaceP.ok + spaceP.minor;
    const spaceOkSeg    = spaceP.ok    > 0 ? `<div class="seg-ok" style="width:${spaceP.ok}%"><span class="seg-label-ok">${spaceP.ok >= 8 ? spaceP.ok+'%' : ''}</span></div>` : '';
    const spaceMinorSeg = spaceP.minor > 0 ? `<div class="seg-mn" style="width:${spaceP.minor}%"><span class="seg-label-mn">${spaceP.minor >= 8 ? spaceP.minor+'%' : ''}</span></div>` : '';
    spaceBarHtml = `<div class="kpi-card" style="margin-bottom:14px">
      <div class="kpi-name">Total Spaces Ready</div>
      <div class="kpi-pct">${spaceCombined}<span class="kpi-pct-unit">%</span></div>
      <div class="kpi-bar-track">${spaceOkSeg}${spaceMinorSeg}</div>
      <div class="kpi-needed"><span class="kpi-needed-num">${spaceP.needed}</span> spaces need attention</div>
    </div>`;
  }

  const timestamps = CAMPUSES.map(c => allData[c.code] && allData[c.code].generated).filter(Boolean);
  const genStr = timestamps.length ? timestamps[0] : '';

  return `
    <div class="net-summary">
      <div class="net-summary-title">Total Signoff Progress</div>
      <div class="bar-legend">
        <span class="bar-legend-item"><span class="bar-legend-swatch" style="background:var(--green)"></span>Fully ready</span>
        <span class="bar-legend-item"><span class="bar-legend-swatch" style="background:var(--yellow)"></span>Minor items remain</span>
      </div>
      ${spaceBarHtml}
      <div class="kpi-list">${cardsHtml}</div>
      ${genStr ? `<div style="font-size:11px;color:var(--muted);margin-top:16px">Updated ${genStr}</div>` : ''}
    </div>`;
}

// A "space" is only Fully Ready when both tracks that apply to it are Fully
// Ready. If one track is N/A for that space (e.g. Tech doesn't apply), the
// other track alone decides. If both are N/A, the space itself is N/A.
function combinedSpaceStatus(room) {
  const sdoCls  = dotClass(room.SDO  ? room.SDO.assessment  : null);
  const techCls = dotClass(room.tech ? room.tech.assessment : null);
  const sdoNA  = sdoCls  === 'dot-na';
  const techNA = techCls === 'dot-na';
  if (sdoNA && techNA) return 'dot-na';
  if (sdoNA)  return techCls;
  if (techNA) return sdoCls;
  if (sdoCls === 'dot-ok' && techCls === 'dot-ok') return 'dot-ok';
  if (sdoCls === 'dot-bad' || techCls === 'dot-bad') return 'dot-bad';
  return 'dot-minor'; // some progress on at least one track, neither fully ready nor bad
}

// ── Total Progress: burndown + spaces-by-category ──────────────────────────
// NOTE: the Apps Script only returns each room's *current* status, not a
// history of what it was on past dates — there's no persisted daily
// snapshot to reconstruct a real trend line from. The "Actual" line below
// can only ever plot a single true data point: today. It'll only become a
// real multi-day trend once something (e.g. a daily Apps Script trigger)
// starts logging "date, total remaining" to a tracking tab. Flagged in the
// UI itself via the dashed "builds up day by day" note.
const CLUSTER_MAP = {AEC:'Anacostia', AMC:'Anacostia', BEC:'Benning', BMC:'Benning', EEC:'Edgewood', EMC:'Edgewood'};
const CLUSTER_COLOR = {Anacostia:'var(--blue)', Benning:'var(--gold)', Edgewood:'var(--green)'};
const START_DATE  = new Date(2026, 6, 30);  // Jul 30, 2026
const TARGET_DATE = new Date(2026, 7, 18);  // Aug 18, 2026
const FDOS_DATE   = new Date(2026, 7, 24);  // Aug 24, 2026 — First Day of School

function countBusinessDays(start, end) {
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

// Returns { totalRemaining, bySection: { sectionName: {Anacostia,Benning,Edgewood} } }
// "Remaining" = a signoff (Operations or Tech) isn't yet confirmed Fully ready —
// each track is counted separately, so a room can contribute up to 2 remaining
// signoffs (one per track) if neither has been confirmed yet.
function computeSpacesRemaining(allData) {
  const bySection = {};
  let totalRemaining = 0;
  const tracks = ['SDO', 'tech'];
  CAMPUSES.forEach(c => {
    const d = allData[c.code];
    if (!d || !d.rooms) return;
    const cluster = CLUSTER_MAP[c.code];
    d.rooms.forEach(r => {
      tracks.forEach(track => {
        const rec = track === 'tech' ? r.tech : r[track];
        const cls = dotClass(rec ? rec.assessment : null);
        if (cls === 'dot-na' || cls === 'dot-ok') return;
        const sec = r.section || 'Other';
        if (!bySection[sec]) bySection[sec] = {Anacostia:0, Benning:0, Edgewood:0};
        bySection[sec][cluster]++;
        totalRemaining++;
      });
    });
  });
  return { totalRemaining, bySection };
}

function buildBurndownChart(totalRemaining) {
  if (!totalRemaining) {
    return `<div class="progress-block">
      <div class="progress-block-title">BURNDOWN</div>
      <div class="chart-headline"><span class="num">0</span><span class="lbl">signoff remaining — fully caught up!</span></div>
    </div>`;
  }
  const totalDays  = countBusinessDays(START_DATE, FDOS_DATE);
  const targetDay   = countBusinessDays(START_DATE, TARGET_DATE);
  const todayDay    = 1; // dashboard always computes "remaining" live, as of today

  const L = 40, R = 620, TOP = 40, BOT = 217;
  const xStep = (R - L) / (totalDays - 1);
  const xFor  = d => (L + (d - 1) * xStep).toFixed(1);
  const yFor  = v => (BOT - (v / totalRemaining) * (BOT - TOP)).toFixed(1);

  let idealPts = [];
  for (let d = 1; d <= totalDays; d++) {
    const v = d <= targetDay ? totalRemaining * (1 - (d - 1) / (targetDay - 1)) : 0;
    idealPts.push(`${xFor(d)},${yFor(v)}`);
  }

  const todayX = xFor(todayDay), targetX = xFor(targetDay), fdosX = xFor(totalDays);
  const todayY = yFor(totalRemaining);

  return `<div class="progress-block">
    <div class="progress-block-title">BURNDOWN</div>
    <div class="chart-headline"><span class="num">${totalRemaining}</span><span class="lbl">signoff remaining</span></div>
    <div class="chart-legend">
      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#94a3b8"></span>Ideal pace</span>

      <line x1="40" y1="128" x2="620" y2="128" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="172" x2="620" y2="172" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="217" x2="620" y2="217" stroke="#cbd5e1" stroke-width="1.5"/>

      <text x="34" y="44"  font-size="10" fill="#94a3b8" text-anchor="end">${totalRemaining}</text>
      <text x="34" y="221" font-size="10" fill="#94a3b8" text-anchor="end">0</text>

      <line x1="${todayX}" y1="40" x2="${todayX}" y2="217" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="${todayX}" y="34" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">TODAY</text>

      <line x1="${targetX}" y1="40" x2="${targetX}" y2="217" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="${targetX}" y="14" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">TARGET FOR</text>
      <text x="${targetX}" y="29" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">100% READINESS</text>

      <line x1="${fdosX}" y1="40" x2="${fdosX}" y2="217" stroke="#E5A810" stroke-width="2"/>
      <text x="${fdosX}" y="14" font-size="12" fill="#E5A810" text-anchor="middle" font-weight="700">FIRST DAY OF</text>
      <text x="${fdosX}" y="29" font-size="12" fill="#E5A810" text-anchor="middle" font-weight="700">SCHOOL</text>

      <polyline points="${idealPts.join(' ')}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,5"/>
      <circle cx="${todayX}" cy="${todayY}" r="5" fill="#005E9E"/>

      <text x="40" y="230" font-size="10" fill="#94a3b8" text-anchor="middle">Jul 30</text>
      <text x="${targetX}" y="230" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Aug 18</text>
      <text x="${fdosX}" y="230" font-size="10" fill="#94a3b8" text-anchor="middle">Aug 24</text>
    </svg>
  </div>`;
}

function buildSpacesLeftChart(bySection, totalRemaining) {
  const sections = Object.entries(bySection)
    .map(([name, counts]) => ({ name, counts, total: counts.Anacostia + counts.Benning + counts.Edgewood }))
    .filter(s => s.total > 0)
    .sort((a, b) => b.total - a.total);

  if (!sections.length) return '';
  const maxTotal = sections[0].total;

  const rows = sections.map(s => {
    const widthPct = (s.total / maxTotal * 100).toFixed(1);
    const segs = ['Anacostia', 'Benning', 'Edgewood'].map(cl => {
      const n = s.counts[cl];
      if (!n) return '';
      const segPct = (n / s.total * 100).toFixed(1);
      return `<div class="cat-seg" style="width:${segPct}%;background:${CLUSTER_COLOR[cl]}">${n}</div>`;
    }).join('');
    return `<div class="cat-row">
      <span class="cat-label">${s.name}</span>
      <div class="cat-bar-track" style="flex:1 1 auto;max-width:${widthPct}%">${segs}</div>
      <span class="cat-count">${s.total}</span>
    </div>`;
  }).join('');

  return `<div class="progress-block">
    <div class="progress-block-title">SIGNOFFS LEFT, BY CATEGORY</div>
    <div class="cat-legend">
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--blue)"></span>Anacostia</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--gold)"></span>Benning</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--green)"></span>Edgewood</span>
    </div>
    ${rows}
  </div>`;
}

// ── Spaces (combined) versions of the two charts above ─────────────────────
// Same structure as computeSpacesRemaining/buildBurndownChart/buildSpacesLeftChart,
// but a room only counts as "remaining" here if it's not Fully Ready by the
// combined-space definition (see combinedSpaceStatus) rather than per-track.
function computeSpaceRemaining(allData) {
  const bySection = {};
  let totalRemaining = 0;
  CAMPUSES.forEach(c => {
    const d = allData[c.code];
    if (!d || !d.rooms) return;
    const cluster = CLUSTER_MAP[c.code];
    d.rooms.forEach(r => {
      const cls = combinedSpaceStatus(r);
      if (cls === 'dot-na' || cls === 'dot-ok') return;
      const sec = r.section || 'Other';
      if (!bySection[sec]) bySection[sec] = {Anacostia:0, Benning:0, Edgewood:0};
      bySection[sec][cluster]++;
      totalRemaining++;
    });
  });
  return { totalRemaining, bySection };
}

    <div class="chart-legend">
      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#94a3b8"></span>Ideal pace</span>
      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--blue)"></span>Actual</span>
    </div>
    <svg viewBox="0 0 680 232" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
      <line x1="40" y1="40"  x2="620" y2="40"  stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="84"  x2="620" y2="84"  stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="128" x2="620" y2="128" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="172" x2="620" y2="172" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="217" x2="620" y2="217" stroke="#cbd5e1" stroke-width="1.5"/>

      <text x="34" y="44"  font-size="10" fill="#94a3b8" text-anchor="end">${totalRemaining}</text>
      <text x="34" y="221" font-size="10" fill="#94a3b8" text-anchor="end">0</text>

      <line x1="${todayX}" y1="40" x2="${todayX}" y2="217" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="${todayX}" y="34" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">TODAY</text>

      <line x1="${targetX}" y1="40" x2="${targetX}" y2="217" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="${targetX}" y="14" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">TARGET FOR</text>
      <text x="${targetX}" y="29" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">100% READINESS</text>

      <line x1="${fdosX}" y1="40" x2="${fdosX}" y2="217" stroke="#E5A810" stroke-width="2"/>
      <text x="${fdosX}" y="14" font-size="12" fill="#E5A810" text-anchor="middle" font-weight="700">FIRST DAY OF</text>
      <text x="${fdosX}" y="29" font-size="12" fill="#E5A810" text-anchor="middle" font-weight="700">SCHOOL</text>

      <polyline points="${idealPts.join(' ')}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,5"/>
      <circle cx="${todayX}" cy="${todayY}" r="5" fill="#005E9E"/>

      <text x="40" y="230" font-size="10" fill="#94a3b8" text-anchor="middle">Jul 30</text>
      <text x="${targetX}" y="230" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Aug 18</text>
      <text x="${fdosX}" y="230" font-size="10" fill="#94a3b8" text-anchor="middle">Aug 24</text>
    </svg>
  </div>`;
}

function buildSpaceCategoryChart(bySection, totalRemaining) {
  const sections = Object.entries(bySection)
    .map(([name, counts]) => ({ name, counts, total: counts.Anacostia + counts.Benning + counts.Edgewood }))
    .filter(s => s.total > 0)
    .sort((a, b) => b.total - a.total);

  if (!sections.length) return '';
  const maxTotal = sections[0].total;

  const rows = sections.map(s => {
    const widthPct = (s.total / maxTotal * 100).toFixed(1);
    const segs = ['Anacostia', 'Benning', 'Edgewood'].map(cl => {
      const n = s.counts[cl];
      if (!n) return '';
      const segPct = (n / s.total * 100).toFixed(1);
      return `<div class="cat-seg" style="width:${segPct}%;background:${CLUSTER_COLOR[cl]}">${n}</div>`;
    }).join('');
    return `<div class="cat-row">
      <span class="cat-label">${s.name}</span>
      <div class="cat-bar-track" style="flex:1 1 auto;max-width:${widthPct}%">${segs}</div>
      <span class="cat-count">${s.total}</span>
    </div>`;
  }).join('');

  return `<div class="progress-block">
    <div class="progress-block-title">SPACES LEFT, BY CATEGORY</div>
    <div class="cat-legend">
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--blue)"></span>Anacostia</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--gold)"></span>Benning</span>
      <span class="cat-legend-item"><span class="cat-legend-swatch" style="background:var(--green)"></span>Edgewood</span>
    </div>
    ${rows}
  </div>`;
}

// ── Data fetching ─────────────────────────────────────────────────────────────
const cache = {};  // campus code → data

async function fetchCampus(code) {
  if (cache[code]) return cache[code];
  const url = `${SCRIPT_URL}?view=boy&campus=${code}`;
  const res  = await fetch(url);
  const data = await res.json();
  cache[code] = data;
  return data;
}

async function loadCampusPanel(code) {
  const panel = document.getElementById(`panel-${code}`);
  panel.innerHTML = '<div class="main">' + loadingBlock('Loading…') + '</div>';
  try {
    const data = await fetchCampus(code);
    if (!data.rooms || !data.rooms.length) {
      panel.innerHTML = '<div class="main"><div class="empty-msg">No submissions yet for ' + code + '.</div></div>';
      return;
    }
    panel.innerHTML = `<div class="main">${buildCampusProgress(data.rooms)}${buildSectionedTables(data.rooms)}</div>`;
    document.getElementById('hdr-meta').textContent = `SY 2026–27 · ${data.generated || ''}`;
  } catch(e) {
    panel.innerHTML = `<div class="main"><div class="empty-msg" style="color:var(--red)">Error loading ${code} data. Check the Apps Script URL.</div></div>`;
  }
}

async function loadOverall() {
  const el = document.getElementById('overall-main');
  el.innerHTML = loadingBlock('Loading all campuses…');
  try {
    const allData = {};
    await Promise.all(CAMPUSES.map(async c => {
      try { allData[c.code] = await fetchCampus(c.code); }
      catch(e) { allData[c.code] = {rooms:[], summary:{}}; }
    }));
    const { totalRemaining, bySection } = computeSpacesRemaining(allData);
    const { totalRemaining: totalSpaceRemaining, bySection: bySectionSpace } = computeSpaceRemaining(allData);
    el.innerHTML = buildOverall(allData)
      + buildBurndownChart(totalRemaining)
      + buildSpacesLeftChart(bySection, totalRemaining)
      + buildSpaceBurndownChart(totalSpaceRemaining)
      + buildSpaceCategoryChart(bySectionSpace, totalSpaceRemaining);
  } catch(e) {
    el.innerHTML = '<div class="empty-msg" style="color:var(--red)">Error loading data.</div>';
  } finally {
    const overlay = document.getElementById('app-loading-overlay');
    if (overlay) overlay.classList.add('hidden');
  }
}

// ── Tab switching ─────────────────────────────────────────────────────────────
const loaded = new Set();

function showTab(id, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.campus-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  el.classList.add('active');

  if (!loaded.has(id)) {
    loaded.add(id);
    if (id === 'overall') {
      loadOverall();
    } else {
      loadCampusPanel(id);
    }
  }
}

// ── Boot: load overall on page open ──────────────────────────────────────────
loaded.add('overall');
loadOverall();
</script>
