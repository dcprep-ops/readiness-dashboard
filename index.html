<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOY Readiness Dashboard</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:image" content="share.png">
<meta property="og:title" content="BOY Space Readiness">
<meta property="og:description" content="DC Prep BOY Space Readiness Dashboard — SY 2026–27">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="share.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons-300.min.css">
<!-- d3 (hierarchy + pack only, in practice) — added for the AMC bubble
     view's circle-packing layout. Nothing else in this file used an
     external JS library before this. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --blue:#005E9E;--blue-web:#0083C4;--gold:#E5A810;
  --green:#16a34a;--yellow:#ffd65a;--red:#dc2626;
  --border:rgba(0,94,158,.1);--bg:#F4F7FA;--card:#fff;
  --lt:#EBF3FB;--text:#1A2B3C;--muted:#6B8299;
  --col-mds:var(--blue);--col-sdo:#7c3aed;--col-dof:#b45309;--col-dot:#0891b2;
  --green-tint:#eafaf1;--yellow-tint:#fff8e1;--red-tint:#fdecea;--yellow-text:#92400e;
  --pending:#378ADD;--pending-tint:#eaf3fc;--card-bg:#FAFAF9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:var(--text);min-height:100vh}

/* ── header ── */
.hdr{background:var(--blue);position:sticky;top:0;z-index:100}
.hdr-gold{height:5px;background:var(--gold)}
.hdr-inner{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-brand{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:2px}
.hdr-title{font-size:18px;font-weight:700;color:#fff}
.hdr-meta{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}

/* campus tabs */
.campus-tabs{display:flex;gap:0;overflow-x:auto;background:rgba(0,0,0,.15);padding:0 12px}
.campus-tab{font-size:12px;font-weight:600;color:rgba(255,255,255,.55);padding:9px 0;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;flex:1;text-align:center;min-width:0;transition:color .15s}
.campus-tab.active{color:#fff;border-bottom-color:var(--gold)}
.campus-tab.sep{border-right:1px solid rgba(255,255,255,.15);padding-right:0;margin-right:0}

/* ── legend ── */
.legend{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.legend-title{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-right:4px;white-space:nowrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}

/* ── dots ── */
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;line-height:1}
.dot-ok    {background:var(--green); color:#fff}
.dot-ok.dot-cleared{background:#a7d7bb;color:#fff}
.dot-minor {background:var(--yellow);color:#1A2B3C}
.dot-bad   {background:var(--red);   color:#fff}
.dot-blank {background:#fff;border:1.5px solid #cbd5e1}
.dot-na    {background:var(--lt);color:var(--muted);font-size:8px;font-weight:600}
.dot-pending {background:#378ADD;color:#fff}

/* ── room card stacks (alternate to the sectioned table) ── */
.view-toggle{display:flex;gap:8px;margin:32px 0 16px}
.view-toggle button{font-size:12px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.view-toggle button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.card-stacks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card-stack-section-title{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card-stack{position:relative}
.room-card{position:relative;border-radius:10px;margin-top:-11px;background:var(--card-bg);
  border:2px solid var(--card);box-shadow:0 2px 5px rgba(0,0,0,.08);cursor:pointer;
  transition:margin .22s ease;z-index:1;overflow:hidden}
.room-card:first-child{margin-top:0}
.room-card.open{z-index:99;margin-top:10px}
.room-card.open + .room-card{margin-top:10px}
.card-titlebar{position:relative;padding:11px 40px 11px 14px}
.card-name{font-weight:600;font-size:13px;color:var(--text)}
.card-type-icon{position:absolute;top:10px;right:12px;font-size:15px;opacity:.7}
.card-detail{max-height:0;overflow:hidden;transition:max-height .22s ease;font-size:12px;padding:0 14px;color:var(--text)}
.room-card.open .card-detail{max-height:220px;padding-bottom:12px}
.card-detail p{margin:4px 0 0}
.status-ok .card-name{color:var(--green)}
.status-minor .card-titlebar{background:var(--yellow-tint)}
.status-bad .card-titlebar{background:var(--red-tint)}
.status-bad .card-name{color:var(--red)}
.status-pending .card-titlebar{background:var(--pending-tint)}
.status-pending .card-name{color:var(--pending)}
.space-name.cleared{color:#B8C4D0;font-weight:400}

/* ── Interactive campus map (AEC / AMC) ──────────────────────────────────
   Traced floor geometry (CAMPUS_MAP_GEOMETRY) rendered full-width, joined
   to live room data by room number. Status shows as outline color only —
   background and text stay constant so color-on-color never fights
   legibility. Tap opens a detail sheet (mobile); on a mouse, hovering
   shows the same detail in a popover instead of requiring a click. */
.cm-floor-label{font-size:11px;font-weight:700;color:var(--text);margin:20px 0 6px}
.cm-wrap{width:100%;position:relative;background:#fff;border:0.5px solid var(--border);border-radius:8px;overflow:visible}
.cm-room{position:absolute;border-radius:3px;display:flex;align-items:flex-end;justify-content:flex-start;cursor:pointer;
  border-width:1.5px;border-style:solid;background:#F4F5F3;color:var(--text);
  overflow:hidden;padding:4px 5px;text-align:left;transition:box-shadow .12s ease}
.cm-room.cm-icon-mode,.cm-room.cm-restroom{align-items:center;justify-content:center;padding:0}
.cm-lbl{font-weight:500;line-height:1.15;overflow-wrap:break-word;word-break:break-word;width:100%}
.cm-icon{font-size:16px;color:var(--muted)}
.cm-room-ok{border-color:var(--green)}
.cm-room-minor{border-color:#e0b32e}
.cm-room-bad{border-color:var(--red)}
.cm-room-pending{border-color:var(--pending)}
.cm-room-untracked,.cm-room-excluded{border-color:#D5D5D0;color:#9AA0A6;cursor:default}
.cm-legend{display:flex;gap:10px;font-size:9.5px;color:var(--muted);flex-wrap:wrap;margin-bottom:4px}
.cm-legend span{display:inline-flex;align-items:center;gap:4px}
.cm-ring{width:10px;height:10px;border-radius:50%;display:inline-block;border-width:1.5px;border-style:solid;background:#F4F5F3}

.cm-hover-card{position:fixed;z-index:200;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);
  width:220px;pointer-events:none;opacity:0;transition:opacity .1s;overflow:hidden}
.cm-hover-card.show{opacity:1}
.cm-hover-titlebar{padding:10px 14px}
.cm-hover-titlebar .cm-hname{font-size:14px;font-weight:700}
.cm-hover-titlebar .cm-hstatus{font-size:11px;opacity:.85;margin-top:1px}
.cm-hover-body{padding:10px 14px 12px;font-size:11px}
.cm-hover-row{display:flex;justify-content:space-between;padding:4px 0}
.cm-hover-row .cm-hlabel{color:var(--muted)}
.cm-hover-row .cm-hvalue{font-weight:600}

.cm-sheet-backdrop{position:fixed;inset:0;background:rgba(10,20,30,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.cm-sheet-backdrop.open{opacity:1;pointer-events:auto}
.cm-sheet{position:fixed;left:0;right:0;bottom:0;max-width:390px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;
  transform:translateY(100%);transition:transform .25s ease;z-index:301;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.cm-sheet.open{transform:translateY(0)}
.cm-sheet-handle{width:36px;height:4px;background:#E0E0E0;border-radius:2px;margin:10px auto}
.cm-sheet-titlebar{padding:14px 20px}
.cm-sheet-titlebar .cm-sroomnum{font-size:19px;font-weight:700}
.cm-sheet-titlebar .cm-ssection{font-size:12px;opacity:.8;margin-top:2px}
.cm-sheet-body{padding:16px 20px 28px}
.cm-sheet-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)}
.cm-sheet-row:last-child{border-bottom:none}
.cm-sheet-row .cm-slabel{font-size:12px;color:var(--muted)}
.cm-sheet-row .cm-svalue{font-size:13px;font-weight:600;text-align:right}
.cm-sheet-note{font-size:12px;color:var(--text);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px}
.cm-hover-titlebar.hstatus-ok,.cm-sheet-titlebar.hstatus-ok{background:transparent;color:var(--green)}
.cm-hover-titlebar.hstatus-minor,.cm-sheet-titlebar.hstatus-minor{background:var(--yellow-tint);color:var(--text)}
.cm-hover-titlebar.hstatus-bad,.cm-sheet-titlebar.hstatus-bad{background:var(--red-tint);color:var(--red)}
.cm-hover-titlebar.hstatus-pending,.cm-sheet-titlebar.hstatus-pending{background:var(--pending-tint);color:var(--pending)}
.row-note{font-size:12px;color:#64748b;margin-top:2px;line-height:1.4}

/* ── AEC space wheel (replaces the interactive map for AEC only) ────────
   Color is reserved for status (the dots + hub/detail track pills use the
   existing .dot-ok/.dot-minor/etc classes already defined above). The
   band, lines, and labels stay black/neutral on purpose. */
.wheel-status-strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.wheel-status-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text)}
.wheel-status-chip .dot{width:9px;height:9px}
.wheel-status-chip .n{color:var(--muted);font-weight:500}
.wheel-selected-label{text-align:center;margin-bottom:10px}
.wheel-selected-name{font-size:16px;font-weight:700;color:var(--text);line-height:1.25}
.wheel-selected-room{font-size:12px;color:var(--muted);margin-top:1px}
.wheel-wrap{position:relative;width:100%;max-width:600px;aspect-ratio:1/1;margin:0 auto;touch-action:none;user-select:none}
@media (max-width:719px){
  /* Shrink the wheel on small screens, using viewport height (not just
     width), so the circle and the card below it can both fit in view
     together without scrolling on a typical phone. */
  .wheel-wrap{max-width:min(300px, 42vh)}
}
.wheel-wrap.dragging{cursor:grabbing}
.wheel-wrap:not(.dragging){cursor:grab}
.wheel-track{position:absolute;inset:0;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--border)}
.band-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wheel-pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--gold);z-index:5;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.wheel-wrap .node{position:absolute;top:0;left:0;transform:translate(-50%,-50%);cursor:pointer;z-index:2;
  display:flex;align-items:center;justify-content:center}
.wheel-wrap .node .dot{display:block;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:width .15s,height .15s,box-shadow .15s}
.wheel-wrap .node.selected{z-index:4}
.center-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:75%;height:75%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--border);padding:4%;z-index:3;overflow:hidden}
.hub-inner{display:none}
.hub-icon{font-size:18px;color:var(--blue);margin-bottom:3px}
.hub-name{font-size:10.5px;font-weight:700;color:var(--text);line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hub-room{font-size:8.5px;color:var(--muted);margin-top:1px}
.hub-extra{display:none}
.hub-section{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:5px}
.hub-tracks{display:flex;gap:10px;margin-top:8px}
.hub-track{display:flex;flex-direction:column;align-items:center;gap:2px}
.hub-track .dot{width:14px;height:14px}
.hub-track-label{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hub-track-text{font-size:7px;color:var(--text);font-weight:600}
.hub-note{font-size:8.5px;color:var(--text);margin-top:6px;line-height:1.3}
.hub-counts{font-size:8px;color:var(--muted);margin-top:4px}
.wheel-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:14px}
.detail-card{display:none;background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-top:24px}
.detail-card.show{display:block}
.detail-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.detail-icon{width:34px;height:34px;border-radius:9px;background:var(--lt);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--blue);flex-shrink:0}
.detail-name{font-size:15px;font-weight:700}
.detail-meta{font-size:11.5px;color:var(--muted)}
.detail-rows{display:flex;gap:10px;margin-top:4px}
.detail-row{flex:1;background:var(--bg);border-radius:8px;padding:9px 10px}
.detail-row-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.detail-row-val{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.detail-note{font-size:12px;color:var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.detail-counts{font-size:11.5px;color:var(--muted);margin-top:8px}
@media (min-width:720px){
  .hub-inner{display:flex;flex-direction:column;align-items:center}
  .hub-icon{font-size:26px}
  .hub-name{font-size:15px;-webkit-line-clamp:3}
  .hub-room{font-size:11.5px}
  .hub-section{font-size:9.5px;margin-top:7px}
  .hub-tracks{margin-top:10px;gap:16px}
  .hub-track .dot{width:17px;height:17px}
  .hub-track-label{font-size:8px}
  .hub-track-text{font-size:8.5px}
  .hub-extra{display:block}
  .detail-card.show{display:none}
}

/* ── AMC space bubbles (replaces the interactive map for AMC only) ──────
   Status colors are softened toward white (see AMC_STATUS_FILL below) so
   they read clearly without being visually loud. Text color per bubble
   is computed from actual contrast against that bubble's background —
   see amcTextColorFor() — not hardcoded, since a fixed white/black
   choice breaks depending on which status color is in play. */
.amc-status-strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.amc-status-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text)}
.amc-status-chip .dot{width:9px;height:9px}
.amc-status-chip .n{color:var(--muted);font-weight:500}
/* The dashboard's shared .main column is 800px — deliberately narrow for
   reading tables/text. That's too narrow for 76 simultaneously-visible,
   guaranteed-legible bubbles (verified: below ~950px wide, most bubbles
   would have to be compressed under their own text-fit minimum, which
   defeats the whole point). This breaks the bubble section out to a
   wider, viewport-relative width without affecting any other panel —
   standard "full width relative to viewport, not to parent" technique. */
.amc-breakout{position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;width:100vw}
.amc-breakout-inner{max-width:1400px;margin:0 auto;padding:0 20px}
@media (min-width:720px){ .amc-breakout-inner{padding:0 30px} }
.amc-bubble-field{position:relative;width:100%;border:1px solid var(--border);border-radius:14px;background:var(--bg)}
.amc-bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:box-shadow .15s,transform .15s;overflow:hidden}
.amc-bubble:hover{box-shadow:0 4px 10px rgba(0,0,0,.18);transform:scale(1.03);z-index:10}
.amc-bubble-label{font-weight:400;line-height:1.15;overflow-wrap:normal;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.amc-popup-overlay{display:none;position:fixed;inset:0;background:rgba(26,43,60,.35);z-index:50;align-items:center;justify-content:center;padding:20px}
.amc-popup-overlay.show{display:flex}
.amc-popup{background:#fff;border-radius:14px;max-width:360px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2);position:relative}
.amc-popup-close{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--muted)}
.amc-popup-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-right:24px}
.amc-popup-icon{width:36px;height:36px;border-radius:10px;background:var(--lt);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--blue);flex-shrink:0}
.amc-popup-name{font-size:16px;font-weight:700}
.amc-popup-meta{font-size:12px;color:var(--muted)}
.amc-popup-rows{display:flex;gap:10px;margin-bottom:10px}
.amc-popup-row{flex:1;background:var(--bg);border-radius:8px;padding:10px 11px}
.amc-popup-row-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.amc-popup-row-val{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.amc-popup-note{font-size:12.5px;color:var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);line-height:1.4}
.amc-popup-counts{font-size:12px;color:var(--muted);margin-top:8px}

/* ── bucketed status squares (alternate to the sectioned table, AMC) ── */
.sq-bucket{margin:0 0 26px}
.sq-bucket-hdr{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sq-bucket-count{color:var(--muted);font-weight:400}
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
.flip-card{perspective:600px;-webkit-perspective:600px;aspect-ratio:1/1;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;-webkit-transform:translateZ(0);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;overflow:hidden;border:0.5px solid var(--border)}
/* College tiles with a secondary color get a top stripe in that color.
   The icon moves below the stripe (padding-top reserves its height) and
   switches to justify-content:space-between so icon and name separate to
   top/bottom instead of grouping at the bottom like non-stripe tiles. */
.flip-face.has-stripe{justify-content:space-between;padding-top:calc(26% + 6px)}
.flip-face.has-stripe::before{content:'';position:absolute;top:0;left:0;right:0;height:26%;background:var(--stripe)}
.flip-back{transform:rotateY(180deg);background:var(--card);border:0.5px solid var(--border);color:var(--muted);justify-content:flex-start;align-items:flex-start;text-align:left}
.sq-badge{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.sq-badge i{font-size:10px}
.sq-type-icon{font-size:13px;opacity:.85;margin-bottom:2px;position:relative;z-index:2}
.sq-name{font-size:11px;line-height:1.2;font-weight:500;position:relative;z-index:2}
.sq-back-text{font-size:9px;line-height:1.35;padding:6px 8px}

/* ── main ── */
.main{max-width:800px;margin:0 auto;padding:16px 20px 40px}
.tab-panel{display:none}.tab-panel.active{display:block}
.section-block{margin-bottom:10px}
.section-hdr{font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#0C447C;background:#E6F1FB;padding:8px 20px;margin:28px -20px 10px}
.section-block:first-child .section-hdr{margin-top:0}

/* ── space table ── */
.space-table{width:100%;border-collapse:collapse}
.space-table th{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:6px 12px;border-bottom:0.5px solid var(--border);text-align:left}
.space-table th.sc{text-align:center;width:62px;padding:6px 4px}

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — paste your deployed Apps Script URL here
// ─────────────────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPbhFWpzKX6S6seb1c0QKplVM22LjZG6bkGMBnTNopry6dDr5YGtffKKR3EsFQ77n5BQ/exec';

function loadingBlock(msg) {
  return '<div class="empty-msg"><div class="loading-ring-wrap"><div class="loading-ring"></div><img src="icon.png" alt="" class="loading-icon"></div><div>' + msg + '</div></div>';
}

// Campus metadata
const CAMPUSES = [
  {code:'BEC', name:'Benning Elementary'},
  {code:'BMC', name:'Benning Middle'},
  {code:'AEC', name:'Anacostia Elementary'},
  {code:'AMC', name:'Anacostia Middle'},
  {code:'EEC', name:'Edgewood Elementary'},
  {code:'EMC', name:'Edgewood Middle'},
];

// Section order — Apps Script groups rooms into these sections via the
// "Section" column in All Spaces. Match those exact strings here.
const SECTION_ORDER = ['Classrooms','Shared Student Spaces','Restrooms','Common Spaces','Offices','Staff Common Spaces','Technology'];

// ── Data sources ──────────────────────────────────────────────────────────────
// MDS / SDO statuses come from boy-readiness submissions (getBOYReadiness).
// Tech status comes from the All Spaces tab col G (Tech helper column) which you
// maintain. The Apps Script getBOYReadiness already returns a `tech` field per
// room once that column is wired up; for now it falls back to null (not assessed).
//
// Classroom readiness (MDS) for classroom-section rooms additionally reads from
// the legacy `readiness` flow (Classroom Readiness tab) via getBOYReadiness —
// the Apps Script already merges those into the MDS field for classroom rows.
// ─────────────────────────────────────────────────────────────────────────────

// ── Dot helpers ───────────────────────────────────────────────────────────────
function dotClass(assessment) {
  if (!assessment) return 'dot-blank';
  const a = assessment.toLowerCase();
  if (a.includes('pending sdo signoff')) return 'dot-pending';
  if (a.includes('fully'))  return 'dot-ok';
  if (a.includes('minor'))  return 'dot-minor';
  if (a.includes('not ready')) return 'dot-bad';
  if (a === 'n/a' || a === 'na') return 'dot-na';
  if (a === 'ready') return 'dot-ok';           // Tech: "Ready"
  if (a === 'issues') return 'dot-bad';          // Tech: "Issues"
  if (a === 'resolved') return 'dot-ok';         // Tech: "Resolved"
  return 'dot-blank';
}

function dotLabel(cls) {
  if (cls === 'dot-ok')    return '✓';
  if (cls === 'dot-minor') return '';
  if (cls === 'dot-bad')   return '!';
  if (cls === 'dot-na')    return '—';
  if (cls === 'dot-pending') return '';
  return '';
}

function makeDot(assessment, size, muted) {
  const cls = dotClass(assessment);
  const lbl = dotLabel(cls);
  const sz  = size || 22;
  const mutedClass = (muted && cls === 'dot-ok') ? ' dot-cleared' : '';
  return `<span class="dot ${cls}${mutedClass}" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.45)}px">${lbl}</span>`;
}

// ── Table builder ─────────────────────────────────────────────────────────────
const INLINE_LEGEND = `
  <div style="display:flex;align-items:center;gap:14px;padding:10px 0 16px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase">Status</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-ok" style="width:18px;height:18px;font-size:9px">✓</span> Fully ready</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-pending" style="width:18px;height:18px;font-size:9px"></span> Pending SDO signoff</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-minor" style="width:18px;height:18px;font-size:9px"></span> Minor items</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-bad" style="width:18px;height:18px;font-size:9px">!</span> Not ready</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-blank" style="width:18px;height:18px"></span> Not assessed</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)"><span class="dot dot-na" style="width:18px;height:18px;font-size:8px">—</span> N/A</span>
  </div>`;

// Urgency rank for sorting within a section — the row's position is driven
// by whichever of its two tracks is more urgent, so a space with even one
// flagged track surfaces above a fully-blank one, and both surface above
// anything cleared.
const URGENCY_RANK = {'dot-bad':0, 'dot-blank':1, 'dot-pending':2, 'dot-minor':3, 'dot-na':4, 'dot-ok':5};
function rowUrgencyRank(r) {
  const opsCls = dotClass(r.SDO ? r.SDO.assessment : null);
  const techCls = dotClass(r.tech ? r.tech.assessment : null);
  return Math.min(URGENCY_RANK[opsCls], URGENCY_RANK[techCls]);
}

function buildSectionedTables(rooms) {
  const groups = {};
  rooms.forEach(r => {
    const sec = r.section || 'Other';
    if (!groups[sec]) groups[sec] = [];
    groups[sec].push(r);
  });

  // Stable sort — ties (same urgency) keep their original order, which
  // reflects the spreadsheet's own sequence.
  Object.keys(groups).forEach(sec => {
    groups[sec].sort((a, b) => rowUrgencyRank(a) - rowUrgencyRank(b));
  });

  const seenSections = new Set();
  let html = INLINE_LEGEND;

  const ordered = [...SECTION_ORDER, ...Object.keys(groups).filter(s => !SECTION_ORDER.includes(s))];
  ordered.forEach(sec => {
    if (!groups[sec] || seenSections.has(sec)) return;
    seenSections.add(sec);
    html += `
    <div class="section-block">
      <div class="section-hdr">${sec}</div>
      <table class="space-table">
        <thead><tr>
          <th>Space</th>
          <th class="sc">Ops</th>
          <th class="sc">Tech</th>
        </tr></thead>
        <tbody>`;
    groups[sec].forEach(r => {
      const hasCounts = sec === 'Classrooms' && (r.deskCount || r.chairCount);
      const isCleared = combinedSpaceStatus(r) === 'dot-ok';
      const nameClass = isCleared ? 'space-name cleared' : 'space-name';
      const showNote = !!(r.notes && !isCleared);
      html += `<tr${hasCounts ? ' class="tight"' : ''}>
        <td>
          <span class="${nameClass}">${r.space}</span>${r.roomNumber ? ` <span class="space-room-num">(${r.roomNumber})</span>` : ''}
          ${showNote ? `<div class="row-note">${r.notes}</div>` : ''}
        </td>
        <td class="sc">${makeDot(r.SDO  ? r.SDO.assessment  : null, 22, isCleared)}</td>
        <td class="sc">${makeDot(r.tech ? r.tech.assessment : null, 22, isCleared)}</td>
      </tr>`;
      if (hasCounts) {
        html += `<tr class="space-counts-row"><td colspan="3">${r.deskCount || '—'} desks · ${r.chairCount || '—'} chairs</td></tr>`;
      }
    });
    html += `</tbody></table></div>`;
  });
  return html || '<div class="empty-msg">No spaces found for this campus.</div>';
}

const SECTION_ICON = {

// matches Offices' briefcase — same icon, flagged as a known overlap rather

const ROOM_ICON = {

// Alternate to buildSectionedTables — same underlying data (mapRoomStatus,
// not the collapsed combinedSpaceStatus, so "not ready" shows as its own
// color here same as it does on the EMC map, not folded into "blank" the
// way the burndown/category charts intentionally do). One overlapping card
// stack per section; sections lay out in a responsive grid so several show
// side by side on a wide screen and stack fully on a narrow one.
function buildRoomCardStacks(rooms) {
  const groups = {};
  rooms.forEach(r => {
    const sec = r.section || 'Other';
    if (!groups[sec]) groups[sec] = [];
    groups[sec].push(r);
  });
  const ordered = [...SECTION_ORDER, ...Object.keys(groups).filter(s => !SECTION_ORDER.includes(s))];

  let html = '<div class="card-stacks-grid">';
  ordered.forEach(sec => {
    const list = groups[sec];
    if (!list || !list.length) return;
    html += `<div><div class="card-stack-section-title">${sec}</div><div class="card-stack">`;
    list.forEach(r => {
      const icon = roomIcon(r);
      const cls = mapRoomStatus(r);
      const statusClass = 'status-' + (STATUS_LABEL[cls] || 'ok');
      const label = r.space + (r.roomNumber ? ` (${r.roomNumber})` : '');
      html += `<div class="room-card ${statusClass}" onclick="toggleRoomCard(this)">
        <div class="card-titlebar">
          <span class="card-name">${label}</span>
          ${icon ? `<i class="ti ${icon} card-type-icon" aria-hidden="true"></i>` : ''}
        </div>
        <div class="card-detail">
          <p>Ops (SDO): ${r.SDO ? r.SDO.assessment : 'Not yet assessed'}</p>
          <p>Tech: ${r.tech ? r.tech.assessment : 'Not yet assessed'}</p>
          ${r.notes ? `<p>${r.notes}</p>` : ''}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += '</div>';
  return html;
}

function toggleRoomCard(el) {
  const stack = el.closest('.card-stack');
  const wasOpen = el.classList.contains('open');
  stack.querySelectorAll('.room-card.open').forEach(c => c.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}

// Classrooms at AMC are named after colleges — background color identifies
// the college, so status can't also live in the background the way it does
// in the sectioned table. Instead each room's status determines which bucket
// it's grouped under (mirrors the BOY sort order used elsewhere: Not Ready →
// Not Yet Assessed → Pending → Minor → Cleared, with N/A last), and a small
// white badge in the corner carries the per-room status on top of that.
// Colors sourced from the dc-prep-classroom-logos skill's colors.md, then
// softened by tinting ~20% toward white rather than desaturating toward
// gray — desaturation was making similarly-dark schools (the navy cluster
// especially) collapse toward the same muddy blue-gray. Tinting keeps each
// hue intact so schools stay identifiable, just lighter.
// `text` is re-derived per school for WCAG contrast against the new `bg`
// (preferring the school's own stripe/secondary color where it still
// passes AA); Virginia, FAMU, Princeton, and Spelman keep the exact text
// colors requested rather than the auto-picked ones.
// `stripe` (secondary color) is left at full saturation since it's a small
// accent, not the dominant fill. Note: Gonzaga and Georgetown share the
// same official primary color at any saturation/tint level — not a bug,
// the stripe (crimson vs. gray) is what tells them apart.

// room name that spells out the whole name, and DC Prep's actual room

const COLLEGE_ALIASES = {
  'george mason': 'mason',
  'boston college': 'boston',
  'johns hopkins': 'hopkins',
  'george washington': 'washington', 'gw': 'washington',
  'chapel hill': 'unc', 'carolina': 'unc',

};
const COLLEGE_DEFAULT = {bg:'var(--blue)', text:'#fff', stripe:null};
function collegeColor(spaceName) {
  const key = (spaceName || '').toLowerCase();
  const direct = Object.keys(COLLEGE_COLORS).find(k => key.includes(k));
  if (direct) return COLLEGE_COLORS[direct];
  const alias = Object.keys(COLLEGE_ALIASES).find(a => key.includes(a));
  if (alias) return COLLEGE_COLORS[COLLEGE_ALIASES[alias]];
  return COLLEGE_DEFAULT;
}

function buildBucketedSquares(rooms) {
  const groups = {};
  rooms.forEach(r => {
    const cls = mapRoomStatus(r);
    if (!groups[cls]) groups[cls] = [];
    groups[cls].push(r);
  });

  let html = '';
  SQ_BUCKETS.forEach(b => {
    const list = groups[b.cls];
    if (!list || !list.length) return;
    html += `<div class="sq-bucket">
      <div class="sq-bucket-hdr" style="color:${b.color}"><i class="ti ${b.icon}" aria-hidden="true"></i>${b.label} <span class="sq-bucket-count">(${list.length})</span></div>
      <div class="sq-grid">`;
    list.forEach(r => {
      const isClassroom = r.section === 'Classrooms';
      const typeIcon = roomIcon(r);
      const label = r.space + (r.roomNumber ? ` (${r.roomNumber})` : '');
      const opsText = r.SDO ? r.SDO.assessment : 'Not yet assessed';
      const techText = r.tech ? r.tech.assessment : 'Not yet assessed';
      let tileStyle, badgeStyle, faceClass = 'flip-face';
      if (isClassroom) {
        const col = collegeColor(r.space);
        tileStyle = `background:${col.bg};color:${col.text}`;
        if (col.stripe) {
          tileStyle += `;--stripe:${col.stripe}`;
          faceClass += ' has-stripe';
        }
        badgeStyle = 'background:rgba(255,255,255,.95)';
      } else {
        tileStyle = 'background:var(--bg);color:var(--text)';
        badgeStyle = 'background:#fff;border:0.5px solid var(--border)';
      }
      html += `<div class="flip-card" onclick="toggleFlip(this)"><div class="flip-inner">
        <div class="${faceClass}" style="${tileStyle}">
          <div class="sq-badge" style="${badgeStyle}"><i class="ti ${b.icon}" style="color:${b.color}" aria-hidden="true"></i></div>
          ${typeIcon ? `<i class="ti ${typeIcon} sq-type-icon" aria-hidden="true"></i>` : ''}
          <span class="sq-name">${label}</span>
        </div>
        <div class="flip-face flip-back"><span class="sq-back-text">Ops: ${opsText}<br>Tech: ${techText}${r.notes ? '<br>' + r.notes : ''}</span></div>
      </div></div>`;
    });
    html += `</div></div>`;
  });
  return html || '<div class="empty-msg">No spaces found for this campus.</div>';
}

// ── Interactive campus map (AEC / AMC) ──────────────────────────────────
// Two-pass build like the EMC map: buildInteractiveMap() returns the HTML
// skeleton (floor labels + empty map containers) that goes into bodyHtml;
// renderInteractiveMap() is called afterward, once those containers are
// actually in the DOM, to do the real work — positioning rooms, sizing
// them to the container's real width, and fitting labels — since that all
// needs real layout dimensions that don't exist until the HTML is inserted.
function buildInteractiveMap(campusCode) {
  const geometry = CAMPUS_MAP_GEOMETRY[campusCode];
  if (!geometry || !geometry.length) {
    return '<div class="empty-msg">No map available for ' + campusCode + ' yet.</div>';
  }
  let html = `<div class="cm-legend">
    <span><span class="cm-ring" style="border-color:var(--green)"></span>Ready</span>
    <span><span class="cm-ring" style="border-color:#e0b32e"></span>Minor</span>
    <span><span class="cm-ring" style="border-color:var(--red)"></span>Not ready</span>
    <span><span class="cm-ring" style="border-color:var(--pending)"></span>Pending</span>
    <span><span class="cm-ring" style="border-color:#D5D5D0"></span>Not tracked</span>
  </div>`;
  geometry.forEach((floor, fi) => {
    html += `<div class="cm-floor-label">${floor.label}</div>
      <div class="cm-wrap" id="cm-wrap-${campusCode}-${fi}"><div style="position:relative" id="cm-inner-${campusCode}-${fi}"></div></div>`;
  });
  return html;
}

const CM_MIN_FS = 8, CM_BASE_FS = 11, CM_MAX_LINES = 2, CM_LINE_HEIGHT = 1.15, CM_ABSOLUTE_MIN_BOX = 20;
function cmFitText(span, box, text) {
  span.textContent = text;
  let fs = CM_BASE_FS;
  span.style.fontSize = fs + 'px';
  function overflows() {
    if (span.scrollHeight > box.clientHeight || span.scrollWidth > box.clientWidth) return true;
    // technically-within-bounds isn't good enough on its own — more than
    // two lines of shrunk text reads as "doesn't fit" even when the box
    // is technically tall enough to contain it without clipping.
    const lines = Math.round(span.scrollHeight / (fs * CM_LINE_HEIGHT));
    return lines > CM_MAX_LINES;
  }
  while (fs > CM_MIN_FS && overflows()) {
    fs -= 0.5;
    span.style.fontSize = fs + 'px';
  }
  return !overflows();
}
// Name-primary: try the name alone first (no room number — number only
// shows up if nothing else fits). Returns false if literally nothing does,
// so the caller can fall back to an icon instead of forcing broken text —
// this replaces an earlier fixed-pixel-size cutoff, which missed odd
// aspect-ratio boxes where the name still didn't fit despite the box not
// being tiny in absolute terms.
function cmPickLabel(span, box, name, roomNum) {
  if (name && cmFitText(span, box, name)) return true;
  // Truncating down to 2-3 characters technically "fits" but isn't
  // meaningful — stop at a floor where the fragment still reads as
  // something, rather than accepting any truncation that satisfies the
  // bounding box.
  const MIN_MEANINGFUL_CHARS = 6;
  if (name && name.length > MIN_MEANINGFUL_CHARS) {
    for (let cut = name.length - 1; cut >= MIN_MEANINGFUL_CHARS; cut--) {
      if (cmFitText(span, box, name.slice(0, cut) + '…')) return true;
    }
  }
  if (cmFitText(span, box, String(roomNum))) return true;
  return false;
}
function cmRestroomIcon(spaceName) {
  const n = (spaceName || '').toLowerCase();
  if (n.includes('boys')) return 'ti-square-rounded-letter-b';
  if (n.includes('girls')) return 'ti-square-rounded-letter-g';
  if (n.includes('all-gender') || n.includes('all gender')) return 'ti-badge-wc';
  return null;
}
const CM_STATUS_LABELS = {ok:'Ready', minor:'Minor items', bad:'Not ready', pending:'Pending signoff'};
const CM_HOVER_CAPABLE = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

function renderInteractiveMap(campusCode, liveRooms) {
  const geometry = CAMPUS_MAP_GEOMETRY[campusCode];
  if (!geometry || !geometry.length) return;
  cmEnsureOverlays();
  const byRoom = {};
  liveRooms.forEach(r => { if (r.roomNumber) byRoom[String(r.roomNumber)] = r; });

  geometry.forEach((floor, fi) => {
    const wrap = document.getElementById(`cm-wrap-${campusCode}-${fi}`);
    const inner = document.getElementById(`cm-inner-${campusCode}-${fi}`);
    if (!wrap || !inner) return;
    const [x0,y0,x1,y1] = floor.bbox;
    const floorW = x1-x0, floorH = y1-y0;
    const scale = wrap.clientWidth / floorW;
    inner.style.width = (floorW*scale)+'px';
    inner.style.height = (floorH*scale)+'px';
    wrap.style.height = (floorH*scale)+'px';
    inner.innerHTML = '';

    floor.rooms.forEach(geo => {
      const live = byRoom[String(geo.room)];
      const w = geo.w*scale, h = geo.h*scale;
      const div = document.createElement('div');
      div.style.left = (geo.x-x0)*scale+'px';
      div.style.top = (geo.y-y0)*scale+'px';
      div.style.width = w+'px';
      div.style.height = h+'px';

      if (geo.excluded || !live) {
        div.className = 'cm-room ' + (geo.excluded ? 'cm-room-excluded' : 'cm-room-untracked');
        inner.appendChild(div);
        return;
      }

      const statusCls = STATUS_LABEL[mapRoomStatus(live)] || 'ok';
      div.className = 'cm-room cm-room-' + statusCls;
      inner.appendChild(div); // must be attached before any scrollHeight/clientHeight measurement below —
                               // an unattached element has no real layout box, so cmFitText's fit checks
                               // were being measured against garbage values, not the room's actual size.
      const rrIcon = cmRestroomIcon(live.space);
      if (rrIcon) {
        div.classList.add('cm-restroom');
        div.innerHTML = `<i class="ti ${rrIcon} cm-icon"></i>`;
      } else if (Math.min(w,h) < CM_ABSOLUTE_MIN_BOX) {
        // Too small for any text to be legible, even a short room number —
        // the room-number fallback in cmPickLabel is short enough that it
        // technically "fits" almost any box by bounding-box math alone, so
        // this catches what that check can't: boxes with no real room to
        // begin with, before even attempting text.
        div.innerHTML = `<i class="ti ${roomIcon(live)} cm-icon"></i>`;
        div.classList.add('cm-icon-mode');
      } else {
        const span = document.createElement('span');
        span.className = 'cm-lbl';
        div.appendChild(span);
        const fits = cmPickLabel(span, div, live.space, geo.room);
        if (!fits) {
          div.innerHTML = `<i class="ti ${roomIcon(live)} cm-icon"></i>`;
          div.classList.add('cm-icon-mode');
        }
      }
      div.title = live.space + (geo.room ? ` (${geo.room})` : '');
      div.onclick = () => cmOpenSheet(live, statusCls);
      if (CM_HOVER_CAPABLE) {
        div.addEventListener('mouseenter', () => cmShowHover(live, statusCls, div));
        div.addEventListener('mouseleave', cmHideHover);
      }
    });
  });
}

// Sheet + hover-card DOM is shared across all campus maps and created once,
// lazily, rather than baked into every panel render.
let _cmOverlaysReady = false;
function cmEnsureOverlays() {
  if (_cmOverlaysReady) return;
  _cmOverlaysReady = true;
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="cm-hover-card" id="cmHoverCard">
      <div class="cm-hover-titlebar" id="cmHoverTitlebar">
        <div class="cm-hname" id="cmHoverName"></div>
        <div class="cm-hstatus" id="cmHoverStatus"></div>
      </div>
      <div class="cm-hover-body">
        <div class="cm-hover-row"><span class="cm-hlabel">Ops (SDO)</span><span class="cm-hvalue" id="cmHoverOps"></span></div>
        <div class="cm-hover-row"><span class="cm-hlabel">Tech (DoT)</span><span class="cm-hvalue" id="cmHoverTech"></span></div>
      </div>
    </div>
    <div class="cm-sheet-backdrop" id="cmSheetBackdrop"></div>
    <div class="cm-sheet" id="cmSheet">
      <div class="cm-sheet-handle"></div>
      <div class="cm-sheet-titlebar" id="cmSheetTitlebar">
        <div class="cm-sroomnum" id="cmSheetRoomNum"></div>
        <div class="cm-ssection" id="cmSheetSection"></div>
      </div>
      <div class="cm-sheet-body">
        <div class="cm-sheet-row"><span class="cm-slabel">Ops (SDO)</span><span class="cm-svalue" id="cmSheetOps"></span></div>
        <div class="cm-sheet-row"><span class="cm-slabel">Tech (DoT)</span><span class="cm-svalue" id="cmSheetTech"></span></div>
        <div id="cmSheetNoteWrap" style="display:none"><div class="cm-sheet-note" id="cmSheetNote"></div></div>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('cmSheetBackdrop').onclick = cmCloseSheet;
}
function cmShowHover(live, statusCls, el) {
  const card = document.getElementById('cmHoverCard');
  document.getElementById('cmHoverName').textContent = live.space + (live.roomNumber ? ` (${live.roomNumber})` : '');
  document.getElementById('cmHoverStatus').textContent = CM_STATUS_LABELS[statusCls];
  document.getElementById('cmHoverTitlebar').className = 'cm-hover-titlebar hstatus-' + statusCls;
  document.getElementById('cmHoverOps').textContent = live.SDO ? live.SDO.assessment : 'Not yet assessed';
  document.getElementById('cmHoverTech').textContent = live.tech ? live.tech.assessment : 'Not yet assessed';
  const rect = el.getBoundingClientRect();
  let left = rect.right + 10;
  if (left + 220 > window.innerWidth) left = rect.left - 230;
  card.style.left = Math.max(8,left)+'px';
  card.style.top = Math.max(8, rect.top)+'px';
  card.classList.add('show');
}
function cmHideHover() {
  const card = document.getElementById('cmHoverCard');
  if (card) card.classList.remove('show');
}
function cmOpenSheet(live, statusCls) {
  document.getElementById('cmSheetRoomNum').textContent = live.space + (live.roomNumber ? ` (${live.roomNumber})` : '');
  document.getElementById('cmSheetSection').textContent = CM_STATUS_LABELS[statusCls];
  document.getElementById('cmSheetTitlebar').className = 'cm-sheet-titlebar hstatus-' + statusCls;
  document.getElementById('cmSheetOps').textContent = live.SDO ? live.SDO.assessment : 'Not yet assessed';
  document.getElementById('cmSheetTech').textContent = live.tech ? live.tech.assessment : 'Not yet assessed';
  const noteWrap = document.getElementById('cmSheetNoteWrap');
  if (live.notes) { noteWrap.style.display='block'; document.getElementById('cmSheetNote').textContent = live.notes; }
  else { noteWrap.style.display='none'; }
  document.getElementById('cmSheet').classList.add('open');
  document.getElementById('cmSheetBackdrop').classList.add('open');
}
function cmCloseSheet() {
  document.getElementById('cmSheet').classList.remove('open');
  document.getElementById('cmSheetBackdrop').classList.remove('open');
}

// ── AEC space wheel ──────────────────────────────────────────────────────
// Replaces the interactive floor map for AEC only. All spaces on one ring,
// grouped into contiguous arcs by SECTION_ORDER, with a fine section-name
// line curving through the outer band. Reuses dotClass/mapRoomStatus/
// roomIcon/SECTION_ICON/SECTION_ORDER already defined above — no
// duplicate status logic here, just layout and interaction.
//
// Two-pass build like the map: buildAECWheel() returns the HTML skeleton,
// renderAECWheel() does the real layout work once it's in the DOM.
const WHEEL_STATUS_TEXT = {'dot-ok':'Fully ready','dot-minor':'Minor items','dot-bad':'Not ready','dot-pending':'Pending SDO','dot-na':'N/A','dot-blank':'Not assessed'};
const WHEEL_GAP_DEG = 3.2;          // visual gap between section arcs
// Radii in a fixed 0–100 viewBox, so the SVG band scales for free via
// width:100%/height:100% while the HTML dot ring is repositioned in real
// pixels on resize. Donut hole (hub) is 75% of the radius, so the ring —
// label, line, dots — fits in the remaining 25%. Label sits inside
// (smaller radius than) the fine divider line; dots sit outermost.
const WHEEL_R_BAND_TEXT = 39, WHEEL_R_BAND_LINE = 42, WHEEL_R_DOT = 45.5;
const WHEEL_CX = 50, WHEEL_CY = 50;

let _wheelRooms = [];        // ordered rooms: section order, then sheet order within section
let _wheelRoomAngle = [];    // local (unrotated) angle per room, same order as _wheelRooms
let _wheelSectionRange = {}; // section -> {start,end} local angle
let _wheelRotation = 0;
let _wheelSelectedIdx = 0;
let _wheelAnimHandle = null;

function buildAECWheel() {
  return `
    <div class="wheel-status-strip" id="wheelStatusStrip"></div>
    <div class="wheel-selected-label" id="wheelSelectedLabel">
      <div class="wheel-selected-name" id="wheelSelectedName">—</div>
      <div class="wheel-selected-room" id="wheelSelectedRoom"></div>
    </div>
    <div class="wheel-wrap" id="wheelWrap">
      <div class="wheel-track"></div>
      <svg class="band-svg" id="bandSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="wheel-pointer"></div>
      <div id="wheelNodesLayer"></div>
      <div class="center-hub" id="wheelHub"></div>
    </div>
    <div class="wheel-hint">Drag the wheel to spin, or tap a space to jump to it</div>
    <div class="detail-card" id="wheelDetailCard">
      <div class="detail-hdr">
        <div class="detail-icon"><i id="wheelDetailIcon" class="ti ti-door"></i></div>
        <div>
          <div class="detail-name" id="wheelDetailName">—</div>
          <div class="detail-meta" id="wheelDetailMeta">—</div>
        </div>
      </div>
      <div class="detail-rows">
        <div class="detail-row">
          <div class="detail-row-label">Ops</div>
          <div class="detail-row-val" id="wheelDetailOps">—</div>
        </div>
        <div class="detail-row">
          <div class="detail-row-label">Tech</div>
          <div class="detail-row-val" id="wheelDetailTech">—</div>
        </div>
      </div>
      <div class="detail-counts" id="wheelDetailCounts" style="display:none"></div>
      <div class="detail-note" id="wheelDetailNote" style="display:none"></div>
    </div>`;
}

function wheelPolar(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}
function wheelArcPath(cx, cy, r, startA, endA, forward) {
  const large = (endA-startA) <= 180 ? 0 : 1;
  const p1 = wheelPolar(cx,cy,r,startA), p2 = wheelPolar(cx,cy,r,endA);
  return forward
    ? `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}`
    : `M ${p2.x} ${p2.y} A ${r} ${r} 0 ${large} 0 ${p1.x} ${p1.y}`;
}

function buildWheelStatusStrip(rooms) {
  const counts = {'dot-ok':0,'dot-minor':0,'dot-bad':0,'dot-pending':0,'dot-blank':0,'dot-na':0};
  rooms.forEach(r => counts[mapRoomStatus(r)]++);
  const order = [['dot-ok','Ready'],['dot-minor','Minor'],['dot-pending','Pending'],['dot-bad','Not ready'],['dot-blank','Not assessed']];
  const strip = document.getElementById('wheelStatusStrip');
  if (!strip) return;
  strip.innerHTML = order.filter(([c])=>counts[c]>0).map(([c,label]) =>
    `<span class="wheel-status-chip"><span class="dot ${c}"></span>${label} <span class="n">${counts[c]}</span></span>`
  ).join('');
}

function renderAECWheel(liveRooms) {
  buildWheelStatusStrip(liveRooms);

  const present = new Set(liveRooms.map(r => r.section));
  const ordered = [...SECTION_ORDER.filter(s => present.has(s)), ...[...present].filter(s => !SECTION_ORDER.includes(s))];
  _wheelRooms = ordered.flatMap(sec => liveRooms.filter(r => r.section === sec));

  const n = _wheelRooms.length;
  const nSections = ordered.length;
  if (!n || !nSections) {
    document.getElementById('wheelHub').innerHTML = '<div class="hub-inner"><div class="hub-name">No spaces found</div></div>';
    return;
  }
  const itemStep = (360 - WHEEL_GAP_DEG*nSections) / n;

  _wheelRoomAngle = [];
  _wheelSectionRange = {};
  let idx = 0;
  ordered.forEach((sec, sIdx) => {
    const items = liveRooms.filter(r => r.section === sec);
    const secStart = -90 + idx*itemStep + sIdx*WHEEL_GAP_DEG;
    items.forEach((r, j) => {
      _wheelRoomAngle.push(secStart + j*itemStep);
      idx++;
    });
    const secEnd = -90 + idx*itemStep + sIdx*WHEEL_GAP_DEG;
    _wheelSectionRange[sec] = { start: secStart - itemStep*0.5, end: secEnd - itemStep*0.5 };
  });

  // Band: fine divider line, sitting just inside the dots, plus a
  // light-weight curved label sitting inside that line (smaller radius,
  // not on top of it). Font-size scales per section to its own arc
  // length so a short section (fewer spaces) doesn't crowd its label —
  // a fixed size that happened to fit the widest section wouldn't
  // necessarily fit the narrowest one.
  const bandSvg = document.getElementById('bandSvg');
  let svg = `<g id="wheelBandGroup">`;
  ordered.forEach((sec, i) => {
    const { start, end } = _wheelSectionRange[sec];
    const fId = `wheelSecF${i}`, rId = `wheelSecR${i}`;
    const arcLen = (end-start) * (Math.PI/180) * WHEEL_R_BAND_TEXT;
    const label = sec.toUpperCase();
    const fontSize = Math.min(2.4, Math.max(1.5, arcLen / (label.length * 0.62)));
    // The reverse-direction path (used for labels flipped into the bottom
    // half so they stay upright) renders text on the opposite side of its
    // baseline — letters extend inward toward the hub instead of outward.
    // Nudge that path's radius out by roughly the label's height so
    // flipped text doesn't creep into the hub.
    const revRadius = WHEEL_R_BAND_TEXT + fontSize * 0.8;
    svg += `<path d="${wheelArcPath(WHEEL_CX,WHEEL_CY,WHEEL_R_BAND_LINE,start,end,true)}" fill="none" stroke="#1A2B3C" stroke-opacity="0.28" stroke-width="0.15"/>`;
    svg += `<path id="${fId}" d="${wheelArcPath(WHEEL_CX,WHEEL_CY,WHEEL_R_BAND_TEXT,start,end,true)}" fill="none"/>`;
    svg += `<path id="${rId}" d="${wheelArcPath(WHEEL_CX,WHEEL_CY,revRadius,start,end,false)}" fill="none"/>`;
    svg += `<text font-size="${fontSize.toFixed(2)}" font-weight="300" letter-spacing="0.03" fill="#1A2B3C">
      <textPath id="wheelSecText${i}" href="#${fId}" startOffset="50%" text-anchor="middle">${label}</textPath>
    </text>`;
  });
  svg += `</g>`;
  bandSvg.innerHTML = svg;

  const nodesLayer = document.getElementById('wheelNodesLayer');
  nodesLayer.innerHTML = '';
  _wheelRooms.forEach((r, i) => {
    const node = document.createElement('div');
    node.className = 'node';
    const cls = mapRoomStatus(r);
    node.innerHTML = `<span class="dot ${cls}" style="width:9px;height:9px"></span>`;
    node.onclick = (e) => { e.stopPropagation(); wheelSpinTo(i); };
    nodesLayer.appendChild(node);
  });

  _wheelRotation = 0;
  _wheelSelectedIdx = 0;
  positionWheelNodes();
  updateWheelHub();

  wheelBindDrag();
}

function positionWheelNodes() {
  const wrap = document.getElementById('wheelWrap');
  if (!wrap) return;
  const size = wrap.getBoundingClientRect().width || 400;
  const cx = size/2, cy = size/2;
  const R = size * (WHEEL_R_DOT/100);
  const n = _wheelRooms.length;
  if (!n) return;

  let closestIdx = 0, closestDelta = Infinity;
  const nodes = document.getElementById('wheelNodesLayer').children;
  for (let i=0;i<n;i++){
    const angle = _wheelRoomAngle[i] + _wheelRotation;
    const rad = angle * Math.PI/180;
    const x = cx + R*Math.cos(rad);
    const y = cy + R*Math.sin(rad);
    const node = nodes[i];
    if (!node) continue;
    node.style.left = x+'px';
    node.style.top = y+'px';

    let delta = ((angle % 360) + 360) % 360;
    delta = Math.min(Math.abs(delta-270), 360-Math.abs(delta-270));
    if (delta < closestDelta){ closestDelta = delta; closestIdx = i; }
  }

  // Only the exact selected dot grows — no gradual size-up on its
  // neighbors, which was making the ring harder to scan at a glance.
  for (let i=0;i<n;i++){
    const node = nodes[i];
    if (!node) continue;
    const isSelected = i === closestIdx;
    const dotEl = node.querySelector('.dot');
    dotEl.style.width = (isSelected ? 22 : 9) + 'px';
    dotEl.style.height = (isSelected ? 22 : 9) + 'px';
    dotEl.style.boxShadow = isSelected ? '0 0 0 3px rgba(0,94,158,.18), 0 1px 2px rgba(0,0,0,.15)' : '0 1px 2px rgba(0,0,0,.15)';
    node.classList.toggle('selected', isSelected);
  }

  const bandGroup = document.getElementById('wheelBandGroup');
  if (bandGroup) bandGroup.setAttribute('transform', `rotate(${_wheelRotation} ${WHEEL_CX} ${WHEEL_CY})`);
  Object.keys(_wheelSectionRange).forEach((sec, i) => {
    const { start, end } = _wheelSectionRange[sec];
    const mid = ((start+end)/2 + _wheelRotation) % 360;
    const midNorm = ((mid % 360)+360)%360;
    const bottomHalf = midNorm > 0 && midNorm < 180;
    const tp = document.getElementById(`wheelSecText${i}`);
    if (tp) tp.setAttribute('href', bottomHalf ? `#wheelSecR${i}` : `#wheelSecF${i}`);
  });

  if (closestIdx !== _wheelSelectedIdx){
    _wheelSelectedIdx = closestIdx;
    updateWheelHub();
  }
}

// The selected space's name shows above the wheel (above the pointer),
// not on the ring itself — the ring only ever shows dots now.
function updateWheelSelectedLabel() {
  const r = _wheelRooms[_wheelSelectedIdx];
  const nameEl = document.getElementById('wheelSelectedName');
  const roomEl = document.getElementById('wheelSelectedRoom');
  if (!nameEl || !roomEl) return;
  if (!r) { nameEl.textContent = '—'; roomEl.textContent = ''; return; }
  nameEl.textContent = r.space;
  roomEl.textContent = r.roomNumber ? 'Room ' + r.roomNumber : '';
}

function updateWheelHub() {
  const hub = document.getElementById('wheelHub');
  const r = _wheelRooms[_wheelSelectedIdx];
  updateWheelSelectedLabel();
  if (!hub || !r) return;
  const opsCls = dotClass(r.SDO ? r.SDO.assessment : null);
  const techCls = dotClass(r.tech ? r.tech.assessment : null);
  const counts = (r.deskCount || r.chairCount) ? `${r.deskCount || '—'} desks · ${r.chairCount || '—'} chairs` : '';
  hub.innerHTML = `
    <div class="hub-inner">
      <i class="hub-icon ti ${roomIcon(r)}"></i>
      <div class="hub-name">${r.space}</div>
      <div class="hub-room">${r.roomNumber ? 'Room '+r.roomNumber : ''}</div>
      <div class="hub-extra">
        <div class="hub-section">${r.section || ''}</div>
        <div class="hub-tracks">
          <div class="hub-track"><span class="hub-track-label">Ops</span><span class="dot ${opsCls}"></span><span class="hub-track-text">${WHEEL_STATUS_TEXT[opsCls]}</span></div>
          <div class="hub-track"><span class="hub-track-label">Tech</span><span class="dot ${techCls}"></span><span class="hub-track-text">${WHEEL_STATUS_TEXT[techCls]}</span></div>
        </div>
        ${r.notes ? `<div class="hub-note">${r.notes}</div>` : ''}
        ${counts ? `<div class="hub-counts">${counts}</div>` : ''}
      </div>
    </div>`;
  updateWheelDetailCard();
}

function updateWheelDetailCard() {
  const r = _wheelRooms[_wheelSelectedIdx];
  const card = document.getElementById('wheelDetailCard');
  if (!card) return;
  card.classList.toggle('show', !!r);
  if (!r) return;
  document.getElementById('wheelDetailIcon').className = 'ti ' + roomIcon(r);
  document.getElementById('wheelDetailName').textContent = r.space;

  document.getElementById('wheelDetailTech').innerHTML = `<span class="dot ${techCls}" style="width:14px;height:14px"></span> ${WHEEL_STATUS_TEXT[techCls]}`;

  const countsEl = document.getElementById('wheelDetailCounts');

    countsEl.style.display = 'block';

  } else countsEl.style.display = 'none';

  const noteEl = document.getElementById('wheelDetailNote');
  if (r.notes) { noteEl.style.display = 'block'; noteEl.textContent = r.notes; }
  else noteEl.style.display = 'none';
}

function wheelSpinTo(idx) {
  const target = -90 - _wheelRoomAngle[idx];
  let normTarget = ((target % 360)+360)%360;
  let normCurrent = ((_wheelRotation % 360)+360)%360;
  let delta = normTarget - normCurrent;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  wheelAnimateRotation(_wheelRotation + delta);
}

function wheelAnimateRotation(target) {
  if (_wheelAnimHandle) cancelAnimationFrame(_wheelAnimHandle);
  const start = _wheelRotation, dur = 420, t0 = performance.now();
  function step(t) {
    const p = Math.min(1,(t-t0)/dur);
    const eased = 1 - Math.pow(1-p,3);
    _wheelRotation = start + (target-start)*eased;
    positionWheelNodes();
    if (p<1) _wheelAnimHandle = requestAnimationFrame(step);
  }
  _wheelAnimHandle = requestAnimationFrame(step);
}

let _wheelDragBound = false;
function wheelBindDrag() {
  if (_wheelDragBound) return; // wheelWrap element persists across AEC re-renders within a session, only bind once
  _wheelDragBound = true;
  const wrap = document.getElementById('wheelWrap');
  let dragging = false, dragStartAngle = 0, dragStartRotation = 0, pointerId = null;
  function angleFromEvent(e) {
    const rect = wrap.getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    return Math.atan2(e.clientY-cy, e.clientX-cx) * 180/Math.PI;
  }
  wrap.addEventListener('pointerdown', (e)=>{
    if (_wheelAnimHandle) cancelAnimationFrame(_wheelAnimHandle);
    dragging = true; pointerId = e.pointerId;
    wrap.setPointerCapture(pointerId);
    wrap.classList.add('dragging');
    dragStartAngle = angleFromEvent(e);
    dragStartRotation = _wheelRotation;
  });
  wrap.addEventListener('pointermove', (e)=>{
    if (!dragging) return;
    const a = angleFromEvent(e);
    _wheelRotation = dragStartRotation + (a - dragStartAngle);
    positionWheelNodes();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    wrap.classList.remove('dragging');
    wheelSpinTo(_wheelSelectedIdx);
  }
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
}

// ── AMC space bubbles ────────────────────────────────────────────────────
// Replaces the interactive floor map for AMC only. Reuses dotClass/
// mapRoomStatus/roomIcon already defined above — no duplicate status
// logic here, just layout, sizing, and contrast.
//
// Colors here are intentionally separate from the shared .dot-ok/etc CSS
// classes used elsewhere (AEC wheel, sectioned tables) — these are
// softened toward white specifically for this whimsical bubble view, and
// applying that globally would unintentionally mute status colors
// dashboard-wide. Kept as inline-styled hex values, not a shared class.
const AMC_STATUS_FILL = {'dot-ok':'#A2DAB7','dot-minor':'#F5DC9F','dot-bad':'#F1A8A8','dot-pending':'#378ADD','dot-blank':'#B8C4CE','dot-na':'#EBF3FB'};
const AMC_STATUS_TEXT = {'dot-ok':'Fully ready','dot-minor':'Minor items','dot-bad':'Not ready','dot-pending':'Pending SDO','dot-blank':'Not assessed','dot-na':'N/A'};

// Text color is decided by comparing the actual contrast ratio of black
// vs. white against each bubble's background, not a fixed choice — a
// naive "luminance > 0.5" cutoff gets this wrong for some of these
// colors (tested: white on the pending blue only reaches ~3.6:1, which
// fails WCAG even for large bold text, while black reaches ~5.8:1).
function amcHexToRgb(hex){ hex = hex.replace('#',''); return [0,2,4].map(i => parseInt(hex.substr(i,2),16)); }
function amcRelLuminance(hex){
  const [r,g,b] = amcHexToRgb(hex).map(c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); });
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function amcContrastRatio(L1, L2){ const hi = Math.max(L1,L2), lo = Math.min(L1,L2); return (hi+0.05)/(lo+0.05); }
function amcTextColorFor(bgHex){
  const Lbg = amcRelLuminance(bgHex);
  const cBlack = amcContrastRatio(Lbg, 0), cWhite = amcContrastRatio(Lbg, 1);
  return cBlack >= cWhite ? '#1A2B3C' : '#ffffff';
}

// Bubble size is derived from the space's own name, not the other way
// around: font stays constant (regular weight, one size for every
// bubble — no shrinking to fit), and the bubble grows to hold it.
// requiredDiameter() simulates a real greedy word-wrap (never splits a
// word) and binary-searches for the smallest diameter where (a) the
// longest single word fits on a line by itself and (b) the wrapped text
// fits vertically. Classrooms get a further size bonus from real seat
// capacity on top of that.
const AMC_LABEL_FONT_SIZE = 13, AMC_LABEL_CHAR_WIDTH = 0.50, AMC_LABEL_LINE_HEIGHT = 1.2, AMC_LABEL_PAD_FRAC = 0.66;
function amcRequiredDiameter(text){
  const words = text.split(' ');
  const longestWordLen = Math.max(...words.map(w => w.length));
  let lo = 20, hi = 500;
  for (let i=0; i<40; i++){
    const mid = (lo+hi)/2;
    const usable = mid * AMC_LABEL_PAD_FRAC;
    const longestWordW = longestWordLen * AMC_LABEL_FONT_SIZE * AMC_LABEL_CHAR_WIDTH;
    if (longestWordW > usable) { lo = mid; continue; }
    let lines = 1, curLen = 0;
    for (const w of words) {
      const sep = curLen > 0 ? 1 : 0;
      const candidateLen = curLen + sep + w.length;
      if (candidateLen * AMC_LABEL_FONT_SIZE * AMC_LABEL_CHAR_WIDTH <= usable) {
        curLen = candidateLen;
      } else {
        lines++;
        curLen = w.length;
      }
    }
    const textH = lines * AMC_LABEL_FONT_SIZE * AMC_LABEL_LINE_HEIGHT;
    if (textH <= usable) { hi = mid; } else { lo = mid; }
  }
  return hi;
}
// The room's own required diameter — full-size, never compressed. Both
// the organic pack layout and the row-fallback layout (below) size off
// this same number, so "does this bubble meet its minimum" always means
// the same thing regardless of which layout is actually in use.
function amcOwnDiameter(r){
  let d = amcRequiredDiameter(r.space);
  const chairs = parseInt(r.chairCount) || 0;
  if (chairs > 0) d += Math.min(30, chairs*0.6);
  return Math.max(60, d);
}
function amcBubbleValue(r){
  const radius = amcOwnDiameter(r)/2;
  return radius*radius; // squared: d3.pack() sizes circles by area, not radius
}

// Row-based fallback layout: places every bubble at its full required
// diameter (never smaller) and wraps to a new row when the current one
// would exceed the available width — trading height for width instead
// of ever compressing a bubble. Used only when the organic pack layout
// (below) can't fit everyone at their required size within the current
// width; see the shortfall check in renderAMCBubbles().
function amcShelfLayout(rooms, W, gap){
  const items = rooms.map(r => ({ room: r, d: amcOwnDiameter(r) }));
  const rows = [];
  let current = [], x = 0;
  items.forEach(it => {
    if (current.length && x + it.d > W) {
      rows.push({ items: current, width: x - gap });
      current = []; x = 0;
    }
    current.push({ ...it, xOffset: x });
    x += it.d + gap;
  });
  if (current.length) rows.push({ items: current, width: x - gap });

  const placed = [];
  let y = 0;
  rows.forEach(row => {
    const rowH = Math.max(...row.items.map(it => it.d));
    const centerOffset = (W - row.width) / 2;
    row.items.forEach(it => {
      placed.push({ room: it.room, x: centerOffset + it.xOffset + it.d/2, y: y + rowH/2, r: it.d/2 });
    });
    y += rowH + gap;
  });
  return { placed, contentH: y - gap };
}

  ).join('');

let _amcRooms = [];
function renderAMCBubbles(liveRooms){
  amcBuildStatusStrip(liveRooms);
  amcBindPopup();
  _amcRooms = liveRooms;
  const field = document.getElementById('amcBubbleField');
  if (!field) return;
  const W = field.clientWidth;
  const PAD = window.innerWidth >= 720 ? 30 : 16;

  // Flat circle packing — no section-level grouping in the layout (see
  // the earlier note on why nesting by section produced a rigid,
  // grid-like arrangement no matter how tight the padding was).
  //
  // Two independent safety checks decide whether the organic pack is
  // actually safe to use at this width, rather than trusting one number:
  //
  // 1. A conservative ANALYTICAL pre-check, computed straight from this
  //    render's own room list — not a hardcoded pixel breakpoint, so it
  //    stays correct if the room count or name lengths ever change. Sum
  //    every room's own required circle area and assume a deliberately
  //    pessimistic 50% packing efficiency (circle packing with widely
  //    varying sizes rarely does better than that) to get a safe minimum
  //    width. Below it, skip the pack attempt entirely.
  // 2. A post-hoc check on the pack's *actual* output, in case reality
  //    still undershoots that estimate for some reason.
  // Either one failing sends us to the row layout instead — every bubble
  // at full required size, wrapping to more rows rather than shrinking.
  const totalArea = liveRooms.reduce((sum, r) => { const rad = amcOwnDiameter(r)/2; return sum + Math.PI*rad*rad; }, 0);
  const ASSUMED_PACK_EFFICIENCY = 0.5;
  const safeWidthThreshold = 2 * Math.sqrt(totalArea / (Math.PI * ASSUMED_PACK_EFFICIENCY));

  let placed, contentW, contentH;
  if (W < safeWidthThreshold) {
    const shelf = amcShelfLayout(liveRooms, W - 2*PAD, 6);
    placed = shelf.placed.map(p => ({ room: p.room, x: p.x, y: p.y, r: p.r }));
  } else {
    const data = { name: 'root', children: liveRooms.map(r => ({ name: r.space, value: amcBubbleValue(r), room: r })) };
    const root = d3.hierarchy(data).sum(d => d.value || 0).sort((a,b) => b.value - a.value);
    d3.pack().size([W, W*3]).padding(4)(root);
    const packLeaves = root.leaves();
    const packShortfall = packLeaves.some(n => n.r*2 < amcOwnDiameter(n.data.room) - 0.5);
    if (!packShortfall) {
      placed = packLeaves.map(n => ({ room: n.data.room, x: n.x, y: n.y, r: n.r }));
    } else {
      const shelf = amcShelfLayout(liveRooms, W - 2*PAD, 6);
      placed = shelf.placed.map(p => ({ room: p.room, x: p.x, y: p.y, r: p.r }));
    }
  }

  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  placed.forEach(p => {
    minX = Math.min(minX, p.x-p.r); maxX = Math.max(maxX, p.x+p.r);
    minY = Math.min(minY, p.y-p.r); maxY = Math.max(maxY, p.y+p.r);
  });
  contentW = maxX-minX; contentH = maxY-minY;
  const offsetX = PAD + (Math.max(0, W - 2*PAD - contentW))/2 - minX; // center horizontally within the padded width
  const offsetY = PAD - minY; // anchor to the top, not centered vertically

  field.style.height = Math.round(contentH + PAD*2) + 'px';

  field.innerHTML = '';
  placed.forEach(p => {
    const r = p.room;
    const cls = mapRoomStatus(r);
    const bg = AMC_STATUS_FILL[cls];
    const el = document.createElement('div');
    el.className = 'amc-bubble';
    el.style.width = (p.r*2)+'px';
    el.style.height = (p.r*2)+'px';
    el.style.left = (p.x + offsetX - p.r)+'px';
    el.style.top = (p.y + offsetY - p.r)+'px';
    el.style.background = bg;
    const pad = Math.max(8, p.r * 0.3);
    const textColor = amcTextColorFor(bg);
    const shadow = textColor === '#ffffff' ? 'text-shadow:0 1px 2px rgba(0,0,0,.3)' : '';
    el.innerHTML = `<span class="amc-bubble-label" style="font-size:${AMC_LABEL_FONT_SIZE}px;padding:${pad.toFixed(0)}px;color:${textColor};${shadow}">${r.space}</span>`;
    el.onclick = () => amcOpenPopup(r);
    field.appendChild(el);
  });
}
